:root {
  /* Ground */
  --bg-void:        #05060A;
  --bg-panel:       #0C0F16;
  --bg-raised:      #141926;
  --bg-inset:       #020308;

  /* Yellow — earned */
  --earn:           #FCEE0A;
  --earn-dim:       #BCAF16;
  --earn-glow:      #FCEE0A40;

  /* Cyan — structure */
  --struct:         #1CB5A3;
  --struct-bright:  #2FE3CC;
  --struct-dim:     #146E64;

  /* Red — at risk */
  --risk:           #FF4D4D;
  --risk-deep:      #9D2529;
  --risk-glow:      #FF4D4D33;

  /* Attribute identity — NOT part of the semantic system.
     These six carry "which attribute" only. They never signal state:
     earned stays yellow, at-risk stays red, structure stays cyan.
     Hues sit as far from the three reserved hues (0, 57, 173) and
     from each other as possible — 31° minimum, the best available
     once three colours are spoken for. */
  --attr-leaf:      #80DE54;
  --attr-jade:      #4BDD7E;
  --attr-azure:     #5CA9E0;
  --attr-indigo:    #877EE7;
  --attr-violet:    #CB7EE7;
  --attr-magenta:   #E576C9;

  /* Text */
  --text-primary:   #E8ECF2;
  --text-secondary: #8A94A6;
  --text-ghost:     #3A4252;

  /* Lines */
  --line-strong:    #1CB5A3;
  --line-weak:      #1E2634;

  /* Ambient HUD — alpha values, kept here with every other colour */
  --glow-struct:    #1CB5A31F;
  --glow-earn:      #FCEE0A0F;
  --grid-line:      #FFFFFF08;
  --scrim:          #00000059;
  --edge-hi:        #FFFFFF12;

  /* Faces */
  --f-ui:  "Rajdhani", system-ui, -apple-system, sans-serif;
  --f-num: "Orbitron", "Rajdhani", system-ui, sans-serif;

  /* The notched corner: opposite corners cut, the other two square.
     Cut scales with element size — 8 buttons, 12 cards, 16 panels. */
  --cut-8:  polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  --cut-12: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  --cut-16: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);

  /* Motion. Fast and mechanical — this should feel like hardware. */
  --t-tap:   80ms linear;
  --t-card:  180ms cubic-bezier(.2,0,0,1);
  --t-bar:   500ms ease-out;
  --t-screen: 220ms ease-out;

  --tap: 48px;
  --gap: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg-void);
  color: var(--text-primary);
  font: 500 17px/1.4 var(--f-ui);
  -webkit-text-size-adjust: 100%;
}

/* App shell. The page itself never scrolls — the column fills the
   viewport and only <main> scrolls inside it. A fixed-position nav
   sits above the browser chrome on screens too short to scroll, which
   put the bar in a different place on every tab. This cannot. */
html { height: 100%; }
body {
  height: 100vh;
  height: 100dvh;              /* tracks the collapsing iOS toolbar */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- tabular figures ---
   Neither Rajdhani nor Orbitron ships a tnum feature, so tabular
   alignment is done in layout: one fixed cell per character. Without
   this, counting numerals visibly jitter as digits change width. */
.tnum > i { display: inline-block; width: .86em; text-align: center; font-style: normal; }
.tnum > i.sep { width: .4em; }

/* --- shell --- */
.topbar {
  flex: 0 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) 16px 0;
  border-bottom: 1px solid var(--line-weak);
}
.wordmark {
  font: 900 24px/1 var(--f-num);
  letter-spacing: .15em; text-transform: uppercase;
  color: var(--text-primary);
}
.topmeta {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 8px 0 10px;
  font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-secondary);
}

main {
  flex: 1 1 auto;
  min-height: 0;               /* lets the flex child actually shrink */
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
}
main.screen-in { animation: rise var(--t-screen) both; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* --- bottom navigation. Four slots plus the locked fifth. --- */
.navbar {
  flex: 0 0 auto; z-index: 40;
  display: flex;
  background: var(--bg-panel);
  border-top: 1px solid var(--line-weak);
  /* Hug the home indicator rather than clearing it entirely — the full
     inset leaves a visible strip of dead panel under the labels. */
  padding-bottom: max(0px, calc(env(safe-area-inset-bottom) - 14px));
}
.navbar button {
  flex: 1; min-height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; border-top: 2px solid transparent;
  color: var(--struct-dim);
  font: 600 13px/1 var(--f-ui); letter-spacing: .06em;
  transition: color var(--t-tap);
}
.navbar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.navbar button.on { color: var(--earn); border-top-color: var(--earn); }
.navbar button:disabled { color: var(--text-ghost); }

/* --- structural rule with terminal tick. The deck's own device. --- */
.sechead {
  position: relative;
  margin: 26px 0 10px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line-weak);
  font: 600 15px/1.2 var(--f-ui);
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--struct);
}
.sechead::after {
  content: ""; position: absolute; right: 0; bottom: -3px;
  width: 2px; height: 7px; background: var(--struct);
}
.sechead:first-child { margin-top: 0; }

.muted { color: var(--text-secondary); font: 600 13px/1.35 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; }
.empty { color: var(--text-secondary); font-size: 17px; padding: 22px 0; }

/* Decorative micro-text. Genuinely meaningless — never a real value. */
.micro { font: 400 10px/1 var(--f-ui); letter-spacing: .18em; color: var(--text-ghost); text-transform: uppercase; }

/* --- corner brackets, for major panels only --- */
.brackets {
  background-image:
    linear-gradient(var(--struct), var(--struct)), linear-gradient(var(--struct), var(--struct)),
    linear-gradient(var(--struct), var(--struct)), linear-gradient(var(--struct), var(--struct)),
    linear-gradient(var(--struct), var(--struct)), linear-gradient(var(--struct), var(--struct)),
    linear-gradient(var(--struct), var(--struct)), linear-gradient(var(--struct), var(--struct));
  background-repeat: no-repeat;
  background-size: 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom;
}

/* --- contract card --- */
.card {
  --edge: var(--struct-dim);
  display: flex; align-items: stretch;
  margin-bottom: var(--gap);
  clip-path: var(--cut-12);
  background: linear-gradient(var(--edge), var(--edge)) left / 3px 100% no-repeat, var(--bg-panel);
  transition: opacity var(--t-card);
}
.card.done { --edge: var(--earn); opacity: .55; }
.card.frac { --edge: var(--risk); }
.card.ext  {
  background: repeating-linear-gradient(var(--struct) 0 6px, transparent 6px 12px) left / 3px 100% no-repeat, var(--bg-panel);
}
.card.flash { --edge: var(--earn); animation: edgeflash 320ms steps(2) 1; }
@keyframes edgeflash { 0%, 100% { background-color: var(--bg-panel); } 50% { background-color: var(--bg-raised); } }

.card > .body {
  flex: 1; min-height: var(--tap);
  padding: 11px 14px;
  background: none; border: 0;
  color: inherit; font: 500 17px/1.3 var(--f-ui); text-align: left;
  display: block; width: 100%;
}
.card .name { font: 600 18px/1.25 var(--f-ui); }
.card .meta {
  margin-top: 3px;
  font: 600 13px/1.4 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-secondary);
}
.card .xp { color: var(--earn-dim); font-family: var(--f-num); font-weight: 500; font-size: 15px; }
.card.done .xp { color: var(--earn); }
.card .run { font-family: var(--f-num); font-weight: 500; font-size: 15px; color: var(--text-primary); }
.card .risk { color: var(--risk); }
.card .flag { color: var(--struct); }
.card .side { display: flex; align-items: center; padding-right: 8px; }
.card .glyph { color: var(--earn); font-family: var(--f-num); font-weight: 700; }

/* The fractured numeral carries a static RGB split. It only animates
   when ambient effects are switched on — nothing loops while idle. */
.card.frac .run {
  color: var(--risk);
  text-shadow: 1.5px 0 var(--struct-bright), -1.5px 0 var(--risk-deep);
}
body[data-ambient="1"] .card.frac .run { animation: glitch 400ms steps(1) infinite; }

@keyframes glitch {
  0%   { transform: none;                text-shadow: 1.5px 0 var(--struct-bright), -1.5px 0 var(--risk-deep); }
  25%  { transform: translateX(-2px);    text-shadow: 3px 0 var(--risk), -2px 0 var(--struct-bright); clip-path: inset(30% 0 42% 0); }
  50%  { transform: translateX(2px);     text-shadow: -3px 0 var(--struct-bright), 2px 0 var(--risk); clip-path: inset(10% 0 66% 0); }
  75%  { transform: none;                clip-path: none; }
  100% { transform: none;                text-shadow: 1.5px 0 var(--struct-bright), -1.5px 0 var(--risk-deep); }
}

.glyphrow { display: flex; align-items: center; gap: 12px; }
.cardglyph { flex: none; color: var(--edge); display: flex; }
.card.done .cardglyph { color: var(--earn); }
.glyphrow .grow { flex: 1; min-width: 0; }

/* --- buttons --- */
button { cursor: pointer; font-family: var(--f-ui); }
.btn {
  --btn-line: var(--struct);
  --btn-fill: var(--bg-void);
  min-height: var(--tap); padding: 0 16px;
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--btn-fill), var(--btn-fill)) padding-box,
    linear-gradient(var(--btn-line), var(--btn-line)) border-box;
  color: var(--btn-line);
  clip-path: var(--cut-8);
  font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
  transition: transform var(--t-tap), background var(--t-tap);
}
.btn.primary { --btn-line: var(--earn); --btn-fill: var(--earn); color: var(--bg-void); }
.btn.danger  { --btn-line: var(--risk); }
.btn:active  { --btn-fill: var(--bg-raised); transform: translateY(1px); }
.btn.primary:active { --btn-fill: var(--earn-dim); --btn-line: var(--earn-dim); }
.btn:disabled { opacity: .3; }
.btn.small { min-height: 40px; padding: 0 12px; }
.btn.full  { width: 100%; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--gap); }

/* --- angled tabs. One angled edge, not symmetric. --- */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tabs button {
  flex: 1; min-height: var(--tap);
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--bg-void), var(--bg-void)) padding-box,
    linear-gradient(var(--line-weak), var(--line-weak)) border-box;
  color: var(--text-secondary);
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
}
.tabs button.on {
  background: var(--earn); border-color: var(--earn); color: var(--bg-void);
}

/* --- forms --- */
label {
  display: block; margin: 18px 0 7px;
  font: 600 13px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase;
  color: var(--struct);
}
input[type=text], input[type=number], select, textarea {
  width: 100%; min-height: var(--tap); padding: 11px 13px;
  background: var(--bg-inset);
  border: 1.5px solid var(--line-weak);
  color: var(--text-primary);
  font: 500 17px/1.3 var(--f-ui);
  clip-path: var(--cut-8);
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible { outline: 2px solid var(--struct-bright); outline-offset: 2px; }
textarea { min-height: 76px; resize: vertical; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick button {
  min-width: var(--tap); min-height: var(--tap);
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--bg-inset), var(--bg-inset)) padding-box,
    linear-gradient(var(--line-weak), var(--line-weak)) border-box;
  color: var(--text-secondary);
  clip-path: var(--cut-8);
  font: 600 13px/1 var(--f-ui); letter-spacing: .06em;
}
.daypick button.on { --x: 0; background: var(--earn); border-color: var(--earn); color: var(--bg-void); }

.panel {
  background: var(--bg-panel); border: 1px solid var(--line-weak);
  padding: 13px 15px; margin-bottom: var(--gap);
  clip-path: var(--cut-12);
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.checkline { display: flex; align-items: center; gap: 12px; min-height: var(--tap); }
.checkline input { width: 22px; height: 22px; accent-color: var(--earn); flex: none; }
.checkline span { font-size: 15px; }

.swatches { display: flex; gap: 8px; margin: 12px 0 8px; }
.swatch {
  width: 40px; height: 40px; padding: 0;
  border: 2px solid transparent;
  clip-path: var(--cut-8);
}
.swatch.on { border-color: var(--text-primary); }

/* --- progression --- */
.stats { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lv { font: 700 32px/1 var(--f-num); letter-spacing: .02em; }
.stats .sc {
  text-align: right;
  font: 600 13px/1.5 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
  color: var(--struct);
}
.stats .tx { color: var(--earn); font-family: var(--f-num); font-weight: 500; font-size: 15px; }

/* Square ends, inset trough. Rounded ends are Kitsch; this is structure. */
.bar { height: 6px; background: var(--bg-inset); margin: 9px 0 5px; overflow: hidden; }
.bar i {
  display: block; height: 100%; background: var(--earn);
  transition: width var(--t-bar);
  box-shadow: 0 0 6px var(--earn-glow);
}
.bar.struct i { background: var(--struct); box-shadow: none; }

.perk {
  border: 1.5px solid var(--line-weak); padding: 12px 14px; margin-bottom: 8px;
  clip-path: var(--cut-8);
}
.perk.on { border-color: var(--earn-dim); }
.perk .pn { font: 600 15px/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); }
.perk.on .pn { color: var(--earn); }
.perk .pc { font: 500 13px/1.45 var(--f-ui); color: var(--text-secondary); margin-top: 3px; }

.radar { width: 100%; max-width: 400px; margin: 10px auto; display: block; overflow: visible; }
.radar .rgrid { fill: none; stroke: var(--line-weak); stroke-width: 1.5; }
.radar .raxis { stroke: var(--line-weak); stroke-width: 1.5; }
.radar .rdata { fill: var(--struct-dim); fill-opacity: .3; stroke: var(--struct); stroke-width: 2; }
.radar .rlabel { font: 600 13px var(--f-ui); letter-spacing: .08em; }

/* --- records --- */
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.calnav .m { font: 700 15px/1 var(--f-num); letter-spacing: .1em; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow {
  text-align: center; padding-bottom: 2px;
  font: 600 13px/1 var(--f-ui); letter-spacing: .06em; color: var(--struct);
}
.day {
  position: relative; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-panel); border: 1px solid var(--line-weak);
  padding: 0;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
}
.day.pad { background: none; border: 0; clip-path: none; }
.day .fill { position: absolute; inset: 0; background: var(--earn); }
.day .n { position: relative; font: 500 13px/1 var(--f-num); color: var(--text-secondary); }
.day.has .n { color: var(--text-primary); }
.day.lv3 .n, .day.lv4 .n { color: var(--bg-void); font-weight: 700; }
.day.sel { outline: 2px solid var(--text-primary); outline-offset: -2px; }
.day:disabled { opacity: .25; }

.strip { display: flex; gap: 1px; overflow-x: auto; padding: 10px 0 4px; }
.strip i { flex: 0 0 6px; height: 18px; background: var(--bg-raised); }
.strip i.hit  { background: var(--earn); }
.strip i.miss { background: var(--risk-deep); }
.strip i.pre  { background: var(--bg-inset); }
.strip i.open { background: var(--struct-dim); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chip {
  padding: 7px 9px; border: 1.5px solid var(--line-weak); color: var(--text-secondary);
  font: 500 13px/1 var(--f-num); letter-spacing: .04em;
  clip-path: var(--cut-8);
}
.chip.met { border-color: var(--earn-dim); color: var(--earn-dim); }
.seg {
  padding: 6px 0; border-bottom: 1px solid var(--line-weak);
  font: 600 13px/1.4 var(--f-ui); letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-secondary);
}
.seg .risk { color: var(--risk); }
.retrodate {
  margin: 14px 0 7px;
  font: 600 13px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-secondary);
}

/* --- reward moments. The only place the aesthetic gets loud. --- */
.fullclear {
  margin: 14px 0; padding: 14px;
  border: 1.5px solid var(--earn); color: var(--earn);
  background: var(--earn-glow);
  clip-path: var(--cut-12);
  font: 700 15px/1 var(--f-num); letter-spacing: .22em; text-align: center;
}

#overlay {
  position: fixed; inset: 0; z-index: 80;
  display: none; align-items: center; justify-content: center;
  padding: 32px;
  background: var(--bg-void);
}
#overlay.on { display: flex; animation: burst 400ms steps(1) 1; }
#overlay .inner { text-align: center; padding: 28px 20px; max-width: 420px; width: 100%; }
#overlay .kicker {
  font: 600 15px/1 var(--f-ui); letter-spacing: .3em; text-transform: uppercase;
  color: var(--struct);
}
#overlay .big {
  font: 900 72px/1 var(--f-num); letter-spacing: .04em;
  color: var(--earn); margin: 14px 0;
  animation: slam 420ms cubic-bezier(.2,0,0,1) both;
}
#overlay .sub { font: 600 17px/1.5 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--text-primary); }
#overlay .perks { margin-top: 18px; }
#overlay .perks div { color: var(--earn); font: 600 15px/1.6 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; }
#overlay .dismiss { margin-top: 26px; color: var(--text-secondary); font: 600 13px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; }

@keyframes burst {
  0%   { filter: none; transform: translateX(0); }
  25%  { filter: invert(1) hue-rotate(90deg); transform: translateX(-6px); }
  50%  { filter: none; transform: translateX(5px); }
  75%  { filter: invert(1); transform: translateX(-2px); }
  100% { filter: none; transform: none; }
}
@keyframes slam { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* --- completion effects ---
   Every one is a one-shot. Nothing loops, and all of it is disabled
   under prefers-reduced-motion by the block further down. */
@keyframes fx-sweep { from { transform: translateX(0); } to { transform: translateX(330%); } }
.fx-sweep { position: relative; overflow: hidden; }
.fx-sweep::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -45%; width: 45%;
  background: linear-gradient(90deg, transparent, var(--earn-glow) 35%, var(--earn-glow) 65%, transparent);
  animation: fx-sweep 500ms ease-out 1;
  pointer-events: none;
}

@keyframes fx-jolt {
  0%   { transform: none; }
  20%  { transform: translateX(-3px) skewX(-1.5deg); }
  45%  { transform: translateX(3px) skewX(1deg); }
  70%  { transform: translateX(-1px); }
  100% { transform: none; }
}
.fx-jolt { animation: fx-jolt 300ms steps(2) 1; }

@keyframes fx-chroma {
  0%, 100% { text-shadow: none; }
  25% { text-shadow: 2px 0 var(--risk), -2px 0 var(--struct-bright); }
  55% { text-shadow: -3px 0 var(--earn), 3px 0 var(--struct-bright); }
  80% { text-shadow: 1px 0 var(--struct-bright); }
}
.fx-chroma { animation: fx-chroma 320ms steps(2) 1; }

@keyframes fx-pop {
  0%   { transform: scale(.72); }
  55%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.fx-pop { animation: fx-pop 320ms cubic-bezier(.2,0,0,1) 1; }


#update {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(72px + env(safe-area-inset-bottom));
  z-index: 55;
  max-width: 608px; margin: 0 auto;
  display: none; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px;
  background: var(--bg-raised);
  border: 1.5px solid var(--earn);
  clip-path: var(--cut-8);
  color: var(--earn);
  font: 600 13px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase;
}
#update.on { display: flex; }

#toast {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(72px + env(safe-area-inset-bottom));
  z-index: 50;
  max-width: 608px; margin: 0 auto;
  padding: 13px 15px;
  background: var(--bg-raised);
  border: 1.5px solid var(--struct);
  clip-path: var(--cut-8);
  color: var(--text-primary);
  font: 600 15px/1.35 var(--f-ui); letter-spacing: .06em;
  display: none;
}
#toast.risk { border-color: var(--risk); color: var(--risk); }
#toast.earn { border-color: var(--earn); color: var(--earn); }
#toast.on { display: block; animation: rise 180ms both; }


/* ============================================================
   AMBIENT — premium HUD, not a degraded CRT.
   A blueprint grid at the threshold of visibility, soft bloom off
   the top and bottom edges, and a vignette. All static gradients:
   nothing flickers, nothing loops, nothing costs battery.
   ============================================================ */
body[data-ambient="1"]::after {
  content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none;
  background:
    radial-gradient(130% 70% at 50% -15%, var(--glow-struct), transparent 62%),
    radial-gradient(120% 55% at 50% 115%, var(--glow-earn), transparent 62%),
    radial-gradient(140% 100% at 50% 50%, transparent 55%, var(--scrim)),
    linear-gradient(transparent 47px, var(--grid-line) 47px) 0 0 / 100% 48px,
    linear-gradient(90deg, transparent 47px, var(--grid-line) 47px) 0 0 / 48px 100%;
}

/* ============================================================
   PALETTE VARIANTS
   Only the structure colour and the ground move. Earned stays
   yellow and at-risk stays red in every theme — those two carry
   meaning, so a theme is never allowed to touch them.
   ============================================================ */
body[data-theme="militech"] {
  --struct: #4C8DFF; --struct-bright: #86B4FF; --struct-dim: #2B558F;
  --line-strong: #4C8DFF; --line-weak: #1B2536;
  --glow-struct: #4C8DFF1F;
}
body[data-theme="netwatch"] {
  --struct: #C3D2E4; --struct-bright: #F2F7FF; --struct-dim: #6B7B90;
  --line-strong: #C3D2E4; --line-weak: #232A34;
  --glow-struct: #C3D2E416;
}
body[data-theme="arasaka"] {
  --bg-void: #0A0507; --bg-panel: #150A0D; --bg-raised: #21121A; --bg-inset: #060203;
  --struct: #A8B4C2; --struct-bright: #DCE6F2; --struct-dim: #5A6472;
  --line-strong: #A8B4C2; --line-weak: #2A1B20;
  --glow-struct: #9D25291F;
}
body[data-theme="kangtao"] {
  --bg-void: #05080A; --bg-panel: #0B1114; --bg-raised: #121B1F; --bg-inset: #020506;
  --struct: #37C8A0; --struct-bright: #6BF0CB; --struct-dim: #1E7A61;
  --line-strong: #37C8A0; --line-weak: #17242A;
  --glow-struct: #37C8A01F;
}

/* ============================================================
   GLYPHS
   ============================================================ */
.gl {
  width: 24px; height: 24px; flex: none; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: square; stroke-linejoin: miter;
}
/* Scaled up, the stroke scales too, so the nominal width comes down
   to land near 2px rendered — the brief's preferred weight. */
.gl.big  { width: 34px; height: 34px; stroke-width: 1.3; }
.gl.huge { width: 52px; height: 52px; stroke-width: 1.0; }

.glyphsel {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px; margin-bottom: 4px;
  background: var(--bg-panel); border: 1.5px solid var(--line-weak);
  clip-path: var(--cut-12);
  color: var(--struct);
}
.glyphcats { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; }
.glyphcats button {
  flex: none; min-height: 40px; padding: 0 12px;
  background: none; border: 1.5px solid var(--line-weak); color: var(--text-secondary);
  clip-path: var(--cut-8);
  font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
}
.glyphcats button.on { border-color: var(--earn); color: var(--earn); }
.glyphgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; margin-top: 8px; }
.glyphgrid button {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg-inset); border: 1.5px solid var(--line-weak); color: var(--struct);
  clip-path: var(--cut-8);
}
.glyphgrid button.on { border-color: var(--earn); color: var(--earn); background: var(--earn-glow); }

/* ============================================================
   DASHBOARD — circular nodes
   Three across on a 390px screen, so nine to twelve sit in one
   screenful. The glyph carries identity, the ring carries state and
   the hold charge, and the run rides the rim as a badge.
   ============================================================ */
.viewtog { display: flex; gap: 8px; margin-bottom: 14px; }
.nodegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 16px 10px; }

.node {
  --edge: var(--struct-dim);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 0; background: none; border: 0;
  color: var(--text-primary);
  touch-action: pan-y;                 /* the board still scrolls under a hold */
}
.node .disc {
  position: relative;
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
}
.node .ringsvg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  transform: rotate(-90deg);           /* the sweep starts at twelve o'clock */
  overflow: visible;
}
.node .ringsvg circle { fill: none; stroke-width: 3; }
.node .rbase { stroke: var(--edge); opacity: .55; }
.node .rprog {
  stroke: var(--earn);
  stroke-dasharray: 289;
  stroke-dashoffset: 289;              /* 2 * PI * 46, hidden at rest */
  filter: drop-shadow(0 0 3px var(--earn-glow));
}
.node .nglyph { color: var(--edge); display: flex; }
.node .nbadge {
  position: absolute; right: -3px; bottom: -3px;
  min-width: 24px; height: 24px; padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-void); border: 1.5px solid var(--edge);
  color: var(--text-primary);
  font: 700 15px/1 var(--f-num);
  clip-path: var(--cut-8);
}
.node .nbadge { font-size: 13px; }
.node .nbadge.zero { color: var(--text-ghost); }
.node .nbadge.done { color: var(--earn); border-color: var(--earn); font-family: var(--f-ui); }
.node .nname {
  font: 600 13px/1.25 var(--f-ui);
  text-align: center; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.node .nmeta {
  font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-secondary); text-align: center;
}
.node .nmeta .risk { color: var(--risk); }

.node.charging .rprog { animation: sweep 620ms linear forwards; }
.node.charging .nglyph { color: var(--earn); animation: fx-jolt 620ms steps(3) 1; }
.node.charging .nbadge { border-color: var(--earn); color: var(--earn); }
@keyframes sweep { to { stroke-dashoffset: 0; } }

.node.done { --edge: var(--earn); opacity: .5; }
.node.done .rbase { opacity: 1; }
.node.frac { --edge: var(--risk); }
.node.frac .rbase { stroke-dasharray: 10 6; }
.node.frac .nbadge { color: var(--risk); text-shadow: 1.5px 0 var(--struct-bright), -1.5px 0 var(--risk-deep); }
.node.ext .rbase { stroke-dasharray: 4 6; --edge: var(--struct); }
.node:disabled { opacity: .45; }

/* ============================================================
   HUD CHROME
   ============================================================ */
.hud {
  position: relative;
  padding: 14px 14px 12px;
  margin-bottom: 16px;
  background:
    linear-gradient(var(--bg-panel), var(--bg-panel)) padding-box,
    linear-gradient(120deg, var(--struct-dim), var(--line-weak) 45%, var(--struct-dim)) border-box;
  border: 1.5px solid transparent;
  box-shadow: inset 0 1px 0 var(--edge-hi);
  clip-path: var(--cut-16);
}
.hud .micro { position: absolute; top: 6px; right: 12px; }

/* --- accessibility. Functional transitions stay; theatre stops. --- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .bar i { transition: none; }
  body[data-ambient="1"]::after { display: none; }
  #overlay .big { opacity: 1; transform: none; }
}
</style>
</head>

</div></div>

<script>
"use strict";

/* ============================================================
   1. STORAGE ADAPTER
   The only place in the app that touches a storage API.

   Three backends behind one async interface, chosen at boot:
     artifact  window.storage, when running inside a Claude artifact
     idb       IndexedDB — the backend on GitHub Pages
     local     localStorage, only if IndexedDB is unavailable

   IndexedDB is preferred over localStorage not for space (a year of
   logs is around 100KB) but because it is asynchronous, is not capped
   at 5MB, and is the store navigator.storage.persist() protects.
   ============================================================ */
const Store = (function () {
  const NS = "ncos:";
  const DB_NAME = "night-city-os";
  const DB_VERSION = 1;
  const KV = "kv";

  const hasArtifact = typeof window !== "undefined" &&
    window.storage && typeof window.storage.get === "function";

  let mode = "local";
  let dbPromise = null;

  function openDB() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains(KV)) d.createObjectStore(KV);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error("indexeddb blocked"));
      });
    }
    return dbPromise;
  }

  function idb(writable, run) {
    return openDB().then(d => new Promise((resolve, reject) => {
      const t = d.transaction(KV, writable ? "readwrite" : "readonly");
      let req;
      try { req = run(t.objectStore(KV)); }
      catch (e) { reject(e); return; }
      t.onabort = () => reject(t.error);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
  }

  function lsKeys(prefix) {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.indexOf(NS + prefix) === 0) out.push(k);
    }
    return out;
  }

  /* Anything written before the move to IndexedDB is carried across
     once, additively. The localStorage copy is left untouched. */
  async function migrateFromLocal() {
    if (typeof localStorage === "undefined") return 0;
    const existing = await idb(false, st => st.getAllKeys());
    if (existing && existing.length) return 0;
    const keys = lsKeys("");
    for (const k of keys) await idb(true, st => st.put(localStorage.getItem(k), k));
    return keys.length;
  }

  async function init() {
    if (hasArtifact) { mode = "artifact"; return mode; }
    if (typeof indexedDB !== "undefined") {
      try {
        await idb(false, st => st.getAllKeys());
        mode = "idb";
        const moved = await migrateFromLocal();
        if (moved) console.info("migrated " + moved + " keys from localStorage");
        return mode;
      } catch (e) {
        dbPromise = null;                      // private mode, or IDB disabled
      }
    }
    mode = "local";
    return mode;
  }

  async function save(key, value) {
    const raw = JSON.stringify(value);
    if (mode === "artifact") { await window.storage.set(NS + key, raw, false); return; }
    if (mode === "idb") { await idb(true, st => st.put(raw, NS + key)); return; }
    localStorage.setItem(NS + key, raw);
  }

  async function load(key) {
    let raw = null;
    if (mode === "artifact") {
      try {
        const res = await window.storage.get(NS + key, false);
        raw = res ? res.value : null;
      } catch (e) { return null; }             // a missing key throws in this backend
    } else if (mode === "idb") {
      try { raw = await idb(false, st => st.get(NS + key)); }
      catch (e) { return null; }
    } else {
      raw = localStorage.getItem(NS + key);
    }
    if (raw === null || raw === undefined) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  async function listKeys(prefix) {
    const p = prefix || "";
    if (mode === "artifact") {
      try {
        const res = await window.storage.list(NS + p, false);
        const keys = res && res.keys ? res.keys : [];
        return keys.map(k => (typeof k === "string" ? k : k.key)).map(k => k.slice(NS.length));
      } catch (e) { return []; }
    }
    if (mode === "idb") {
      try {
        const range = IDBKeyRange.bound(NS + p, NS + p + "\uffff");
        const keys = await idb(false, st => st.getAllKeys(range));
        return (keys || []).map(k => String(k).slice(NS.length));
      } catch (e) { return []; }
    }
    return lsKeys(p).map(k => k.slice(NS.length));
  }

  async function drop(key) {
    if (mode === "artifact") {
      try { await window.storage.delete(NS + key, false); } catch (e) {}
      return;
    }
    if (mode === "idb") {
      try { await idb(true, st => st.delete(NS + key)); } catch (e) {}
      return;
    }
    localStorage.removeItem(NS + key);
  }

  return { init, save, load, listKeys, drop, mode: () => mode };
})();

/* Asks the browser to exempt this origin from routine eviction.
   Granted far more readily once the app is installed to the home
   screen, which is the real reason to install it. */
async function requestPersistence() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (e) { return null; }
}

const GLYPH_BY_ID = {};
GLYPHS.forEach(g => { GLYPH_BY_ID[g.i] = g; });

/* Renders a glyph at whatever size the caller's CSS dictates. Falls
   back to a neutral mark so a contract saved before the library
   existed, or one carrying a stray emoji, still draws something. */
function glyphSVG(id, cls) {
  const g = GLYPH_BY_ID[id];
  const paths = g ? g.d.split("|") : ["M5 5h14v14H5z", "M9 12h6"];
  return '<svg class="gl ' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true">' +
    paths.map(p => '<path d="' + p + '"/>').join("") + "</svg>";

const TIERS = ["trivial", "standard", "demanding", "major"];
/* Display order only. ISO week numbering, the log:YYYY-Www keys and
   n_per_week period boundaries stay Monday-based regardless — those
   are storage structure, not presentation. */
function weekStartDay() {
  const s = state.cfg && state.cfg.WEEK_START_DAY;
  return typeof s === "number" ? s : 0;
}

function dayOrder() {
  const out = [];
  for (let i = 0; i < 7; i++) out.push((weekStartDay() + i) % 7);
  return out;
}
const DAY_LABEL = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

/* ============================================================
   3. DATE HELPERS — local time, ISO strings, ISO week keys
   ============================================================ */
function pad(n) { return n < 10 ? "0" + n : "" + n; }

function toISO(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function fromISO(s) {
  const p = s.split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}

function todayISO() { return toISO(new Date()); }

/* ISO 8601 week key: "2026-W36" */
function isoWeekOf(dateISO) {
  const d = fromISO(dateISO);
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (t.getDay() + 6) % 7;                 // Mon = 0
  t.setDate(t.getDate() - day + 3);                 // nearest Thursday
  const year = t.getFullYear();
  const jan4 = new Date(year, 0, 4);
  const jan4day = (jan4.getDay() + 6) % 7;
  const week1Mon = new Date(year, 0, 4 - jan4day);
  const week = 1 + Math.round((t - week1Mon) / 604800000);
  return year + "-W" + pad(week);
}

/* Every week key touched by an inclusive date range */
function weekKeysBetween(startISO, endISO) {
  const out = [];
  const end = fromISO(endISO);
  const cur = fromISO(startISO);
  while (cur <= end) {
    const k = isoWeekOf(toISO(cur));
    if (out.indexOf(k) === -1) out.push(k);
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function monthStartISO(dateISO) {
  const d = fromISO(dateISO);
  return toISO(new Date(d.getFullYear(), d.getMonth(), 1));
}

function weekStartISO(dateISO) {
  const d = fromISO(dateISO);
  const back = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - back);
  return toISO(d);
}

function prettyDate(dateISO) {
  const d = fromISO(dateISO);
  return DAY_LABEL[d.getDay()] + " " + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();
}
