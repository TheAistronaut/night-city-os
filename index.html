   4. APP STATE
   ============================================================ */
const state = {
  cfg: null,
  attrs: [],
  habits: [],
  meta: null,
  logs: new Map(),        // weekKey -> array of completion records
  view: "board",
  configTab: "contracts",
  glyphOpen: false,
  glyphCat: "all",
  trainTab: "today",
  planDay: null,
  pickEx: false,
  recordsTab: "calendar",
  recordsMonth: null,      // ISO first-of-month currently on show
  selectedDay: null,
  editing: null,          // habit draft object while the editor is open
  today: todayISO()
};

/* ============================================================
   5. DATA LAYER
   ============================================================ */
function makeId(prefix) {
  let id;
  do {
    id = prefix + Math.random().toString(16).slice(2, 6);
  } while (state.habits.some(h => h.id === id) || state.attrs.some(a => a.id === id));
  return id;
}

function getHabit(id)  { return state.habits.find(h => h.id === id) || null; }
function getAttr(id)   { return state.attrs.find(a => a.id === id) || null; }
function attrName(id)  { const a = getAttr(id); return a ? a.name : "UNASSIGNED"; }
function xpFor(habit)  { return state.cfg.XP_TIERS[habit.tier] || 0; }

/* Resolves to a CSS variable reference, never a literal colour. */
function attrColour(id) {
  const a = getAttr(id);
  return a && a.colour && ATTR_COLOURS.indexOf(a.colour) !== -1
    ? "var(--attr-" + a.colour + ")"
    : "var(--struct)";
}

async function loadWeek(weekKey) {
  if (state.logs.has(weekKey)) return state.logs.get(weekKey);
  const rows = (await Store.load("log:" + weekKey)) || [];
  state.logs.set(weekKey, rows);
  return rows;
}

async function saveWeek(weekKey) {
  await Store.save("log:" + weekKey, state.logs.get(weekKey) || []);
  invalidateIndex();
}

/* Streak derivation needs the whole history, so the log is pulled
   into memory once at boot and kept warm. One listKeys plus one
   read per week — about 52 reads after a year of daily use. */
async function loadAllLogs() {
  const keys = await Store.listKeys("log:");
  for (const k of keys) {
    state.logs.set(k.slice(4), (await Store.load(k)) || []);
  }
}

/* habitId -> Set of ISO dates on which it was completed.
   Built once per render and dropped whenever the log changes. */
let indexCache = null;
function invalidateIndex() { indexCache = null; progCache = null; }

function completionIndex() {
  if (indexCache) return indexCache;
  const map = new Map();
  state.logs.forEach(rows => {
    rows.forEach(r => {
      if (r.voided) return;
      if (!map.has(r.habitId)) map.set(r.habitId, new Set());
      map.get(r.habitId).add(r.date);
    });
  });
  indexCache = map;
  return map;
}

function datesFor(idx, habitId) { return idx.get(habitId) || new Set(); }

async function completeHabit(habitId, dateISO, source) {
  const h = getHabit(habitId);
  if (!h || h.archived) return;
  if (h.external) return;

  if (source === "backfill") {
    if (backfillDates(new Date()).indexOf(dateISO) === -1) {
      toast("That occurrence is outside the " + backfillWindowHours() + "h window.", true);
      return;
    }
  } else if (dateISO !== state.today) {
    return;
  }

  const wk = isoWeekOf(dateISO);
  const rows = await loadWeek(wk);
  if (rows.some(r => r.habitId === habitId && r.date === dateISO && !r.voided)) return;

  const before = progression();
  const beforeLevel = before.char.level;
  const beforeSC = before.scBar.level;
  const ev = evaluateHabit(h, datesFor(completionIndex(), h.id), state.today);
  const award = xpAward(h, ev.run, before.attrLevels.get(h.attrId) || 1);

  rows.push({
    habitId: h.id,
    date: dateISO,
    source: source || "manual",
    xp: award,
    attrId: h.attrId
  });
  await saveWeek(wk);
  await recordLongestRun(h);

  const after = progression();
  const fresh = await syncPerks();
  await snapshotTotals();

  const now = progression();
  pendingAnim = {
    fromXP: before.totalXP,
    toXP: now.totalXP,
    fromPct: before.char.span > 0 ? (before.char.into / before.char.span) * 100 : 100,
    toPct: now.char.span > 0 ? (now.char.into / now.char.span) * 100 : 100
  };
  if (now.char.level > beforeLevel) pendingAnim.fromPct = 0;   // bar restarts on a new level

  const perkNames = PERKS.filter(p => fresh.indexOf(p.id) !== -1).map(p => p.name);

  if (now.char.level > beforeLevel) {
    showOverlay("Level up", tnum(now.char.level),
      titleFor(now.scBar.level) + " · " + now.totalXP + " XP", perkNames);
  } else if (after.todayPerfect && !before.todayPerfect) {
    showOverlay("Full clear", tnum("+" + after.dayBonus),
      "Every contract cleared today", perkNames);
  } else {
    let msg = (source === "backfill" ? "Logged for " + prettyDate(dateISO) + ". " : h.name + " cleared. ") +
      "+" + award + " XP";
    if (now.scBar.level > beforeSC) msg += " · Street Cred " + now.scBar.level;
    if (perkNames.length) msg += " · Perk: " + perkNames.join(", ");
    toast(msg, perkNames.length ? "earn" : "");
  }
  render();
}

/* meta.totalXP and meta.streetCred are a snapshot for exports and for
   anyone reading the stored data directly. The app always reads the
   derived values, so drift here can never affect behaviour. */
async function snapshotTotals() {
  const p = progression();
  if (state.meta.totalXP !== p.totalXP || state.meta.streetCred !== p.sc) {
    state.meta.totalXP = p.totalXP;
    state.meta.streetCred = p.sc;
    await Store.save("meta", state.meta);
  }
}

/* longestStreak is the one derived value that is also stored — it has
   to survive a reset, and a reset erases the evidence from the log. */
async function recordLongestRun(habit) {
  const ev = evaluateHabit(habit, datesFor(completionIndex(), habit.id), state.today);
  if (!state.meta.records) state.meta.records = {};
  if (!state.meta.records.longestStreak) state.meta.records.longestStreak = {};
  const book = state.meta.records.longestStreak;
  if ((book[habit.id] || 0) < ev.longest) {
    book[habit.id] = ev.longest;
    await Store.save("meta", state.meta);
  }
}

/* Same-day correction for a mis-tap. The record is tombstoned, never
   removed — every read path skips r.voided, so the derived totals,
   runs and bonuses all fall back exactly as if it had not been logged,
   while the log itself keeps the full history of what actually
   happened. Nothing is ever deleted, only archived. */
async function undoCompletion(habitId, dateISO) {
  const wk = isoWeekOf(dateISO);
  const rows = await loadWeek(wk);
  const i = rows.findIndex(r => r.habitId === habitId && r.date === dateISO && !r.voided);
  if (i === -1) return;
  rows[i].voided = true;
  rows[i].voidedAt = new Date().toISOString();
  await saveWeek(wk);
  await snapshotTotals();
  render();
}

/* ============================================================
   5B. CADENCE ENGINE
   Occurrences, derived runs, fracture state machine, backfill
   eligibility. Nothing in here is stored. Every value is computed
   from the log each time it is needed, so a backfill written today
   repairs a run that broke two days ago with no repair step.
   ============================================================ */

const MAX_LOOKBACK_DAYS = 400;   // ceiling on how far back a run is walked

function addDays(dateISO, n) {
  const d = fromISO(dateISO);
  d.setDate(d.getDate() + n);
  return toISO(d);
}

function daysBetween(aISO, bISO) {
  return Math.round((fromISO(bISO) - fromISO(aISO)) / 86400000);
}

function monthEndISO(dateISO) {
  const d = fromISO(dateISO);
  return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
}

/* Perk seams. Phase 4 unlocks these; the engine already reads them. */
function fractureAllowance() {
  const perks = (state.meta && state.meta.perks) || [];
  return 1 + (perks.indexOf("p_second_wind") !== -1 ? 1 : 0);
}

function backfillWindowHours() {
  const perks = (state.meta && state.meta.perks) || [];
  return perks.indexOf("p_extended_buffer") !== -1 ? 72 : state.cfg.BACKFILL_HOURS;
}

/* Every occurrence period from the habit's creation to today, oldest
   first. A period is one day for daily and weekdays, one ISO week for
   n_per_week, one calendar month for n_per_month. */
function enumeratePeriods(habit, today) {
  const created = habit.createdAt || today;
  const floor = addDays(today, -MAX_LOOKBACK_DAYS);
  const from = created > floor ? created : floor;
  const c = habit.cadence || { type: "daily" };
  const out = [];

  if (c.type === "daily" || c.type === "weekdays") {
    const days = c.type === "weekdays" ? (c.days || []) : null;
    let d = from;
    while (d <= today) {
      if (!days || days.indexOf(fromISO(d).getDay()) !== -1) {
        out.push({ start: d, end: d, target: 1, evaluable: d >= created });
      }
      d = addDays(d, 1);
    }
  } else if (c.type === "n_per_week") {
    let s = weekStartISO(from);
    while (s <= today) {
      out.push({ start: s, end: addDays(s, 6), target: c.n || 1, evaluable: s >= created });
      s = addDays(s, 7);
    }
  } else if (c.type === "n_per_month") {
    let s = monthStartISO(from);
    while (s <= today) {
      out.push({ start: s, end: monthEndISO(s), target: c.n || 1, evaluable: s >= created });
      s = addDays(monthEndISO(s), 1);
    }
  }
  return out;
}

function countInPeriod(dates, p) {
  let n = 0;
  let d = p.start;
  while (d <= p.end) {
    if (dates.has(d)) n++;
    d = addDays(d, 1);
  }
  return n;
}

function periodContaining(habit, dateISO) {
  const c = habit.cadence || { type: "daily" };
  if (c.type === "n_per_week") {
    const s = weekStartISO(dateISO);
    return { start: s, end: addDays(s, 6), target: c.n || 1 };
  }
  if (c.type === "n_per_month") {
    const s = monthStartISO(dateISO);
    return { start: s, end: monthEndISO(s), target: c.n || 1 };
  }
  return { start: dateISO, end: dateISO, target: 1 };
}

/* The state machine. Walks closed periods oldest to newest:

     ACTIVE --miss--> FRACTURED --met--> ACTIVE
                                --miss--> FLATLINED (run resets to 0)
     ACTIVE --miss within FRACTURE_WINDOW_DAYS of the last fracture-->
                                          FLATLINED

   The still-open period is never judged as a miss; it is only allowed
   to add to the run once its target is met. */
function evaluateHabit(habit, dates, today) {
  const periods = enumeratePeriods(habit, today);
  const allowance = fractureAllowance();

  let run = 0, longest = 0, st = "active", brokeAt = null;
  let fractures = [];
  let current = null;

  /* Run segments, oldest first. A segment closes when the run flatlines,
     so RECORDS can show what was lost, not just what survives. */
  /* Every period end at which this habit fractured. Street Cred is
     withheld from any day or week that contains one. */
  const fractureLog = [];
  const segments = [];
  let segStart = null, segFractures = 0, lastMetEnd = null;

  for (const p of periods) {
    p.count = countInPeriod(dates, p);
    p.met = p.count >= p.target;

    if (p.end >= today) { p.open = true; current = p; break; }

    if (p.met) {
      if (run === 0) { segStart = p.start; segFractures = 0; }
      run++;
      lastMetEnd = p.end;
      if (run > longest) longest = run;
      if (st === "fractured") st = "active";
      continue;
    }

    if (!p.evaluable) continue;              // period predates the habit
    if (run === 0 && st === "active") continue;   // nothing to lose yet

    if (st === "fractured") {
      segments.push({ start: segStart, end: lastMetEnd, length: run, fractures: segFractures, ended: "flatlined" });
      run = 0; st = "active"; brokeAt = p.end; fractures = []; segStart = null; segFractures = 0;
    } else {
      const recent = fractures.filter(f => daysBetween(f, p.end) < state.cfg.FRACTURE_WINDOW_DAYS).length;
      if (recent >= allowance) {
        segments.push({ start: segStart, end: lastMetEnd, length: run, fractures: segFractures, ended: "flatlined" });
        run = 0; st = "active"; brokeAt = p.end; fractures = []; segStart = null; segFractures = 0;
      } else {
        fractures.push(p.end);
        fractureLog.push(p.end);
        segFractures++;
        st = "fractured";
      }
    }
  }

  if (current && current.met) {
    if (run === 0) { segStart = current.start; segFractures = 0; }
    run++;
    lastMetEnd = current.end > today ? today : current.end;
    if (st === "fractured") st = "active";
  }
  if (run > longest) longest = run;
  if (run > 0 && segStart) {
    segments.push({ start: segStart, end: lastMetEnd, length: run, fractures: segFractures, ended: "current" });
  }

  const stored = (state.meta && state.meta.records && state.meta.records.longestStreak) || {};
  if ((stored[habit.id] || 0) > longest) longest = stored[habit.id];

  const doneToday = dates.has(today);
  let dueToday;
  const c = habit.cadence || { type: "daily" };
  if (c.type === "daily") dueToday = !doneToday;
  else if (c.type === "weekdays") dueToday = !doneToday && (c.days || []).indexOf(fromISO(today).getDay()) !== -1;
  else dueToday = !doneToday && !!current && current.count < current.target;

  return {
    run: run,
    longest: longest,
    state: st,
    brokeAt: brokeAt,
    current: current,
    segments: segments,
    fractureLog: fractureLog,
    dueToday: dueToday,
    doneToday: doneToday
  };
}

/* Was this habit owed something on a past date? Used by LOG RETRO. */
function wasDueOn(habit, dates, dateISO) {
  if (habit.createdAt && dateISO < habit.createdAt) return false;
  if (dates.has(dateISO)) return false;
  const c = habit.cadence || { type: "daily" };
  if (c.type === "daily") return true;
  if (c.type === "weekdays") return (c.days || []).indexOf(fromISO(dateISO).getDay()) !== -1;
  const p = periodContaining(habit, dateISO);
  return countInPeriod(dates, p) < p.target;
}

/* Past dates still inside the backfill window, most recent first. */
function backfillDates(now) {
  const hours = backfillWindowHours();
  const out = [];
  const todayStr = toISO(now);
  for (let i = 1; i <= Math.ceil(hours / 24) + 1; i++) {
    const d = addDays(todayStr, -i);
    const deadline = fromISO(d).getTime() + 86400000 + hours * 3600000;
    if (now.getTime() < deadline) out.push(d);
  }
  return out;
}

/* --- labels --- */
function cadenceLabel(habit) {
  const c = habit.cadence || { type: "daily" };
  if (c.type === "daily") return "DAILY";
  if (c.type === "weekdays") {
    return dayOrder().filter(d => (c.days || []).indexOf(d) !== -1)
      .map(d => DAY_LABEL[d].slice(0, 2)).join(" ") || "NO DAYS SET";
  }
  if (c.type === "n_per_week") return (c.n || 1) + "× PER WEEK";
  if (c.type === "n_per_month") return (c.n || 1) + "× PER MONTH";
  return "";
}

function progressLabel(habit, ev) {
  const c = habit.cadence || { type: "daily" };
  if (!ev.current || (c.type !== "n_per_week" && c.type !== "n_per_month")) return "";
  return ev.current.count + "/" + ev.current.target +
    (c.type === "n_per_week" ? " THIS WEEK" : " THIS MONTH");
}

function runLabel(ev) {
  if (ev.state === "fractured") {
    return '<span class="risk">SIGNAL DEGRADED</span> RUN <span class="run">' + ev.run + "</span>";
  }
  if (ev.run > 0) return 'RUN <span class="run">' + ev.run + "</span>";
  if (ev.brokeAt) return '<span class="risk">FLATLINED</span>';
  return "";
}

/* ============================================================
   5C. HISTORY QUERIES — read-only views over the log
   ============================================================ */

/* ISO date -> XP earned that day. Sums the XP stored on each record,
   so a tier change today never rewrites what yesterday was worth. */
function xpByDate() {
  const map = new Map();
  state.logs.forEach(rows => {
    rows.forEach(r => { if (!r.voided) map.set(r.date, (map.get(r.date) || 0) + (r.xp || 0)); });
  });
  return map;
}

function completionsOn(dateISO) {
  const out = [];
  state.logs.forEach(rows => {
    rows.forEach(r => { if (r.date === dateISO && !r.voided) out.push(r); });
  });
  return out;
}

/* Habits that were owed on a past date and never logged. Only the
   date-scheduled cadences appear here — a shortfall on an n_per_week
   habit belongs to its week, not to any one day of it. */
function missedOn(dateISO, idx) {
  if (dateISO >= state.today) return [];
  return state.habits.filter(h => {
    const c = h.cadence || { type: "daily" };
    if (c.type !== "daily" && c.type !== "weekdays") return false;
    if (h.external || h.archived) return false;
    if (h.createdAt && dateISO < h.createdAt) return false;
    if (datesFor(idx, h.id).has(dateISO)) return false;
    return c.type === "daily" || (c.days || []).indexOf(fromISO(dateISO).getDay()) !== -1;
  });
}

/* Last 90 days as one cell per day, oldest first. */
function stripCells(habit, dates, today) {
  const c = habit.cadence || { type: "daily" };
  const cells = [];
  for (let i = 89; i >= 0; i--) {
    const d = addDays(today, -i);
    let cls;
    if (habit.createdAt && d < habit.createdAt) cls = "pre";
    else if (dates.has(d)) cls = "hit";
    else if (c.type === "daily" || (c.type === "weekdays" && (c.days || []).indexOf(fromISO(d).getDay()) !== -1)) {
      cls = d === today ? "open" : "miss";
    } else cls = "off";
    cells.push({ date: d, cls: cls });
  }
  return cells;
}

/* Recent periods for the count cadences, newest last. */
function recentPeriods(habit, dates, today, n) {
  const all = enumeratePeriods(habit, today);
  return all.slice(-n).map(p => {
    const count = countInPeriod(dates, p);
    return { start: p.start, end: p.end, count: count, target: p.target, met: count >= p.target, open: p.end >= today };
  });
}
/* ============================================================
   5D. PROGRESSION
   Levels, bonuses, Street Cred and perks. Derived from the log the
   same way runs are, with one exception: the XP awarded for a single
   completion is banked on the record at the moment it is written, so
   a later tier change or perk unlock never rewrites what a past day
   was worth. Bonuses and Street Cred are recomputed each time.
   ============================================================ */

function levelFromXP(xp, k, cap) {
  return Math.min(cap, Math.floor(Math.sqrt(Math.max(0, xp) / k)) + 1);
}

function xpAtLevel(level, k) { return k * Math.pow(level - 1, 2); }

function levelBar(xp, k, cap) {
  const level = levelFromXP(xp, k, cap);
  if (level >= cap) return { level: level, into: 1, span: 1, atCap: true };
  const base = xpAtLevel(level, k);
  const next = xpAtLevel(level + 1, k);
  return { level: level, into: xp - base, span: next - base, next: next, atCap: false };
}

function scBar(sc) {
  const cfg = state.cfg;
  const level = Math.min(cfg.SC_CAP,
    Math.floor(Math.pow(Math.max(0, sc) / cfg.SC_CONSTANT, 1 / cfg.SC_EXPONENT)) + 1);
  const at = L => cfg.SC_CONSTANT * Math.pow(L - 1, cfg.SC_EXPONENT);
  if (level >= cfg.SC_CAP) return { level: level, into: 1, span: 1, atCap: true };
  const base = at(level);
  return { level: level, into: sc - base, span: at(level + 1) - base, atCap: false };
}

function titleFor(scLevel) {
  for (const t of SC_TITLES) if (scLevel >= t.at) return t.name;
  return SC_TITLES[SC_TITLES.length - 1].name;
}

function hasPerk(id) { return ((state.meta && state.meta.perks) || []).indexOf(id) !== -1; }

/* Does this habit owe a completion on this specific date? Only the
   date-scheduled cadences can — an n_per_week target belongs to its
   week, not to any one day inside it. */
function scheduledOn(habit, dateISO) {
  /* TRAINING is a standalone module and does not clear contracts, so
     nothing satisfies an external contract. They stay out of FULL
     CLEAR rather than making a perfect day unreachable. */
  if (habit.archived || habit.external) return false;
  if (habit.createdAt && dateISO < habit.createdAt) return false;
  const c = habit.cadence || { type: "daily" };
  if (c.type === "daily") return true;
  if (c.type === "weekdays") return (c.days || []).indexOf(fromISO(dateISO).getDay()) !== -1;
  return false;
}

/* FULL CLEAR. A day with nothing scheduled is not perfect, it is empty. */
function isPerfectDay(dateISO, idx) {
  let any = false;
  for (const h of state.habits) {
    if (!scheduledOn(h, dateISO)) continue;
    any = true;
    if (!datesFor(idx, h.id).has(dateISO)) return false;
  }
  return any;
}

/* CLEAN WEEK. Closed weeks only — an unfinished week has occurrences
   that have not happened yet, which is not the same as meeting them. */
function isPerfectWeek(monISO, idx, today) {
  if (addDays(monISO, 6) >= today) return false;
  let any = false;
  for (const h of state.habits) {
    if (h.archived || h.external) continue;
    const c = h.cadence || { type: "daily" };
    if (c.type === "n_per_month") continue;         // spans weeks, cannot be judged weekly
    const dates = datesFor(idx, h.id);
    if (c.type === "n_per_week") {
      if (h.createdAt && monISO < h.createdAt) continue;
      any = true;
      let n = 0;
      for (let i = 0; i < 7; i++) if (dates.has(addDays(monISO, i))) n++;
      if (n < (c.n || 1)) return false;
    } else {
      for (let i = 0; i < 7; i++) {
        const d = addDays(monISO, i);
        if (!scheduledOn(h, d)) continue;
        any = true;
        if (!dates.has(d)) return false;
      }
    }
  }
  return any;
}

/* XP for one completion, with the perk multipliers in force right now.
   Called at write time; the result is banked on the record. */
function xpAward(habit, run, attrLevel) {
  let x = xpFor(habit);
  if (hasPerk("p_deep_focus") && (habit.tier === "demanding" || habit.tier === "major")) x *= 1.2;
  if (hasPerk("p_momentum") && run >= 30) x *= 1.1;
  if (hasPerk("p_chrome") && attrLevel >= 20) x *= 1.05;
  return Math.round(x);
}

let progCache = null;

function progression() {
  if (progCache) return progCache;
  const cfg = state.cfg;
  const idx = completionIndex();
  const today = state.today;

  /* --- banked XP from the records themselves --- */
  let recordXP = 0, completions = 0;
  const attrXP = new Map();
  const activeDays = new Set();
  const dayXP = new Map();
  let earliest = today;

  state.logs.forEach(rows => rows.forEach(r => {
    if (r.voided) return;
    const x = r.xp || 0;
    recordXP += x;
    completions++;
    attrXP.set(r.attrId, (attrXP.get(r.attrId) || 0) + x);
    activeDays.add(r.date);
    dayXP.set(r.date, (dayXP.get(r.date) || 0) + x);
    if (r.date < earliest) earliest = r.date;
  }));

  state.habits.forEach(h => { if (h.createdAt && h.createdAt < earliest) earliest = h.createdAt; });
  const floor = addDays(today, -MAX_LOOKBACK_DAYS);
  if (earliest < floor) earliest = floor;

  /* --- runs, fractures and run-milestone Street Cred --- */
  const fractureDays = new Set();
  let longestEver = 0, runSC = 0;
  state.habits.forEach(h => {
    const ev = evaluateHabit(h, datesFor(idx, h.id), today);
    if (ev.longest > longestEver) longestEver = ev.longest;
    ev.fractureLog.forEach(d => fractureDays.add(d));
    ev.segments.forEach(s => {
      if (s.fractures) return;                     // a fractured run earns no Cred
      if (s.length >= 7)   runSC += cfg.SC_RUN_7;
      if (s.length >= 30)  runSC += cfg.SC_RUN_30;
      if (s.length >= 100) runSC += cfg.SC_RUN_100;
    });
  });

  /* --- FULL CLEAR and CLEAN WEEK --- */
  const perfectDays = [];
  let d = earliest;
  while (d <= today) {
    if (isPerfectDay(d, idx)) perfectDays.push(d);
    d = addDays(d, 1);
  }

  const perfectWeeks = [];
  let w = weekStartISO(earliest);
  while (w <= today) {
    if (isPerfectWeek(w, idx, today)) perfectWeeks.push(w);
    w = addDays(w, 7);
  }

  const dayBonus = Math.round(cfg.PERFECT_DAY_XP * (hasPerk("p_overclock") ? 1.5 : 1));
  const bonusXP = perfectDays.length * dayBonus + perfectWeeks.length * cfg.PERFECT_WEEK_XP;
  const totalXP = recordXP + bonusXP;

  /* --- Street Cred: withheld from any period containing a fracture --- */
  let sc = runSC;
  perfectDays.forEach(pd => { if (!fractureDays.has(pd)) sc += cfg.SC_PERFECT_DAY; });
  perfectWeeks.forEach(pw => {
    let clean = true;
    for (let i = 0; i < 7; i++) if (fractureDays.has(addDays(pw, i))) clean = false;
    if (clean) sc += cfg.SC_PERFECT_WEEK;
  });

  /* --- attributes and the perks they unlock --- */
  const attrLevels = new Map();
  state.attrs.forEach(a => {
    attrLevels.set(a.id, levelFromXP(attrXP.get(a.id) || 0, cfg.ATTR_CONSTANT, cfg.ATTR_LEVEL_CAP));
  });
  let peakAttr = 0;
  attrLevels.forEach(v => { if (v > peakAttr) peakAttr = v; });
  const earnedPerks = PERKS.filter(p => peakAttr >= p.at).map(p => p.id);

  const todayPerfect = isPerfectDay(today, idx);

  progCache = {
    totalXP: totalXP,
    recordXP: recordXP,
    bonusXP: bonusXP,
    char: levelBar(totalXP, cfg.LEVEL_CONSTANT, cfg.LEVEL_CAP),
    attrXP: attrXP,
    attrLevels: attrLevels,
    sc: sc,
    scBar: scBar(sc),
    perfectDays: perfectDays,
    perfectWeeks: perfectWeeks,
    todayPerfect: todayPerfect,
    todayXP: (dayXP.get(today) || 0) + (todayPerfect ? dayBonus : 0),
    dayBonus: dayBonus,
    earnedPerks: earnedPerks,
    lifetime: {
      completions: completions,
      longestEver: longestEver,
      daysActive: activeDays.size,
      perfectDays: perfectDays.length,
      perfectWeeks: perfectWeeks.length
    }
  };
  return progCache;
}

/* Perks are permanent once earned, so the unlocked set is stored and
   only ever grows. Returns the newly unlocked ones. */
async function syncPerks() {
  const earned = progression().earnedPerks;
  if (!state.meta.perks) state.meta.perks = [];
  const fresh = earned.filter(id => state.meta.perks.indexOf(id) === -1);
  if (fresh.length) {
    state.meta.perks = state.meta.perks.concat(fresh);
    await Store.save("meta", state.meta);
    invalidateIndex();
  }
  return fresh;
}

/* ============================================================
   6. RENDER
   ============================================================ */
const view = document.getElementById("view");
let lastView = null;

/* Tabular figures, done in layout because neither face ships tnum.
   One fixed cell per character, so a counting numeral cannot jitter. */
function tnum(value) {
  return String(value).split("").map(ch =>
    /[0-9]/.test(ch) ? "<i>" + ch + "</i>" : '<i class="sep">' + esc(ch) + "</i>"
  ).join("");
}

/* Decorative micro-text. Deterministic from a seed so it does not
   churn between renders, and deliberately meaningless — never a real
   value the user might try to read. */
function microFor(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const hex = h.toString(16).toUpperCase().padStart(8, "0");
  return "CC35 " + hex.slice(0, 4) + " " + hex.slice(4, 8);
}

/* Filled in after render because the answer is async. */
function paintPersistState() {
  const el = document.getElementById("persist-state");
  if (!el) return;
  if (!navigator.storage || !navigator.storage.persisted) { el.textContent = "UNSUPPORTED"; return; }
  navigator.storage.persisted()
    .then(ok => { el.textContent = ok ? "GRANTED" : "NOT GRANTED — INSTALL TO HOME SCREEN"; })
    .catch(() => { el.textContent = "UNKNOWN"; });
}

function applyAmbient() {
  document.body.dataset.ambient = state.cfg && state.cfg.AMBIENT ? "1" : "0";
  document.body.dataset.theme = (state.cfg && state.cfg.THEME) || "nightcity";
}

function reducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

let toastTimer = null;
function toast(msg, variant) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "on" + (variant === true || variant === "risk" ? " risk" : (variant ? " " + variant : ""));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 2600);
}

async function render() {
  state.today = todayISO();
  if (!state.recordsMonth) state.recordsMonth = monthStartISO(state.today);
  document.getElementById("topdate").textContent = prettyDate(state.today);
  document.getElementById("topmicro").textContent = microFor(state.today);
  applyAmbient();
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"), b => {
    b.classList.toggle("on", b.dataset.view === state.view);
  });

  /* Only a genuine screen change animates. Re-rendering the board
     after a tap must not re-animate the whole page. */
  if (lastView !== state.view) {
    lastView = state.view;
    view.classList.remove("screen-in");
    void view.offsetWidth;
    view.classList.add("screen-in");
  }

  if (state.view === "board") await renderBoard();
  else if (state.view === "profile") renderProfile();
  else if (state.view === "records") renderRecords();
  else await renderConfig();
  paintPersistState();
  view.scrollTop = 0;
  document.querySelectorAll(".strip").forEach(s => { s.scrollLeft = s.scrollWidth; });
  runStatsAnimation();
}

/* ============================================================
   6C. PROFILE
   ============================================================ */
function renderProfile() {
  const p = progression();
  const c = p.char;
  const cfg = state.cfg;
  const attrs = state.attrs.filter(a => !a.archived);

  let html = '<div class="sechead">PROFILE</div>';
  html += '<div class="row"><div><div class="lv">' + c.level + '</div><div class="muted">LEVEL</div></div>' +
    '<div style="text-align:right"><div class="lv">' + p.totalXP + '</div><div class="muted">TOTAL XP</div></div></div>';
  html += bar(c.into, c.span);
  html += '<div class="muted">' + (c.atCap ? "MAX LEVEL" :
    Math.max(0, c.span - c.into) + " XP TO LEVEL " + (c.level + 1)) + "</div>";
  html += '<div class="muted">' + p.recordXP + " FROM CONTRACTS · " + p.bonusXP + " FROM BONUSES</div>";

  html += '<div class="sechead">STREET CRED</div>';
  html += '<div class="row"><div><div class="lv">' + p.scBar.level + '</div>' +
    '<div class="muted">' + titleFor(p.scBar.level) + '</div></div>' +
    '<div style="text-align:right"><div class="lv">' + p.sc + '</div><div class="muted">CRED</div></div></div>';
  html += bar(p.scBar.into, p.scBar.span, "struct");

  html += '<div class="sechead">ATTRIBUTES</div>';
  html += '<div class="brackets" style="padding:14px 10px">' + radarSVG(attrs, p) + "</div>";

  html += attrs.map(a => {
    const xp = p.attrXP.get(a.id) || 0;
    const lb = levelBar(xp, cfg.ATTR_CONSTANT, cfg.ATTR_LEVEL_CAP);
    const feeders = state.habits.filter(h => !h.archived && h.attrId === a.id).map(h => h.name);
    return '<div class="panel" style="border-left:2px solid ' + attrColour(a.id) + '">' +
      '<div class="row"><div class="grow">' + esc(a.name) + "</div>" +
        '<div class="muted">LV ' + lb.level + " · " + xp + " XP</div></div>" +
      bar(lb.into, lb.span, "struct", attrColour(a.id)) +
      '<div class="muted">' + (feeders.length ? esc(feeders.join(", ")) : "No contracts feeding this") + "</div>" +
    "</div>";
  }).join("");

  html += '<div class="sechead">PERKS</div>';
  html += PERKS.map(perk => {
    const on = hasPerk(perk.id);
    return '<div class="perk' + (on ? " on" : "") + '">' +
      '<div class="pn">' + esc(perk.name) + (on ? "" : " · LOCKED") + "</div>" +
      '<div class="pc">' + esc(perk.effect) + "</div>" +
      '<div class="pc">' + (on ? "UNLOCKED" : "ANY ATTRIBUTE AT LEVEL " + perk.at) + "</div>" +
    "</div>";
  }).join("");

  html += '<div class="sechead">LIFETIME</div>';
  const L = p.lifetime;
  html += '<div class="panel"><div class="muted">' +
    "CONTRACTS CLEARED: " + L.completions + "<br>" +
    "LONGEST RUN EVER: " + L.longestEver + "<br>" +
    "FULL CLEARS: " + L.perfectDays + "<br>" +
    "CLEAN WEEKS: " + L.perfectWeeks + "<br>" +
    "DAYS ACTIVE: " + L.daysActive +
    "</div></div>";
  html += '<p class="micro" style="margin-top:18px">' + microFor("profile") +
    " · BIOMONITOR LINK NOMINAL · NO WARRANTY EXPRESSED OR IMPLIED</p>";

  view.innerHTML = html;
}

/* Radar over 3–6 attributes, scaled to the attribute level cap.
   The viewBox is sized so 13px here renders at roughly 13px on a
   390px phone — the information floor applies to axis labels too. */
function radarSVG(attrs, p) {
  const n = attrs.length;
  if (n < 3) {
    return '<p class="muted">The radar needs at least three active attributes.</p>';
  }
  const w = 358, h = 264, cx = w / 2, cy = 124, r = 76;
  const labelR = r + 10;
  const cap = state.cfg.ATTR_LEVEL_CAP;

  const pt = (i, rad) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
  };
  const poly = frac => {
    const out = [];
    for (let i = 0; i < n; i++) { const q = pt(i, r * frac); out.push(q[0].toFixed(1) + "," + q[1].toFixed(1)); }
    return out.join(" ");
  };

  let svg = '<svg class="radar" viewBox="0 0 ' + w + " " + h + '" xmlns="http://www.w3.org/2000/svg">';
  [0.25, 0.5, 0.75, 1].forEach(f => { svg += '<polygon class="rgrid" points="' + poly(f) + '"/>'; });
  for (let i = 0; i < n; i++) {
    const q = pt(i, r);
    svg += '<line class="raxis" x1="' + cx + '" y1="' + cy + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '"/>';
  }

  const data = [];
  for (let i = 0; i < n; i++) {
    const lv = p.attrLevels.get(attrs[i].id) || 1;
    const q = pt(i, r * Math.max(0.04, lv / cap));
    data.push(q[0].toFixed(1) + "," + q[1].toFixed(1));
  }
  svg += '<polygon class="rdata" points="' + data.join(" ") + '"/>';

  /* Vertex markers carry attribute identity; the polygon itself stays
     structural, since the shape is a reading of the whole profile. */
  for (let i = 0; i < n; i++) {
    const lv = p.attrLevels.get(attrs[i].id) || 1;
    const q = pt(i, r * Math.max(0.04, lv / cap));
    svg += '<circle r="4" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) +
      '" fill="' + attrColour(attrs[i].id) + '"/>';
  }

  /* First word only, so long names such as "Technical Ability" stay
     inside the frame. The panels below carry the full name and level. */
  for (let i = 0; i < n; i++) {
    const q = pt(i, labelR);
    const dx = q[0] - cx;
    const anchor = dx < -6 ? "end" : (dx > 6 ? "start" : "middle");
    const dy = q[1] < cy - 6 ? -4 : (q[1] > cy + 6 ? 12 : 4);
    const word = attrs[i].name.trim().split(/\s+/)[0].slice(0, 12).toUpperCase();
    svg += '<text class="rlabel" x="' + q[0].toFixed(1) + '" y="' + (q[1] + dy).toFixed(1) +
      '" text-anchor="' + anchor + '" fill="' + attrColour(attrs[i].id) + '">' + esc(word) + "</text>";
  }
  return svg + "</svg>";
}

/* ============================================================
   6B. RECORDS
   ============================================================ */
const MONTH_LABEL = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN",
                     "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

function renderRecords() {
  let html =
    '<div class="tabs">' +
      '<button data-action="rtab" data-tab="calendar" class="' + (state.recordsTab === "calendar" ? "on" : "") + '">CALENDAR</button>' +
      '<button data-action="rtab" data-tab="contracts" class="' + (state.recordsTab === "contracts" ? "on" : "") + '">PER CONTRACT</button>' +
    "</div>";

  html += state.recordsTab === "calendar" ? renderCalendar() : renderPerContract();
  view.innerHTML = html;
}

function renderCalendar() {
  const xp = xpByDate();
  const pr = progression();
  const perfect = new Set(pr.perfectDays);
  const dayTotal = iso => (xp.get(iso) || 0) + (perfect.has(iso) ? pr.dayBonus : 0);
  const month = state.recordsMonth;
  const d = fromISO(month);
  const last = Number(monthEndISO(month).slice(8));

  /* Intensity is scaled to the busiest day of the month on show, so a
     quiet month still reads rather than sitting uniformly dark. */
  let peak = 0;
  for (let i = 1; i <= last; i++) {
    const t = dayTotal(month.slice(0, 8) + pad(i));
    if (t > peak) peak = t;
  }

  const thisMonth = monthStartISO(state.today);
  let html =
    '<div class="calnav">' +
      '<button class="btn small" data-action="month" data-dir="-1">PREV</button>' +
      '<span class="m">' + MONTH_LABEL[d.getMonth()] + " " + d.getFullYear() + "</span>" +
      '<button class="btn small" data-action="month" data-dir="1"' +
        (month >= thisMonth ? " disabled" : "") + ">NEXT</button>" +
    "</div>";

  html += '<div class="cal">';
  dayOrder().forEach(n => { html += '<div class="dow">' + DAY_LABEL[n].slice(0, 1) + "</div>"; });

  const lead = (d.getDay() - weekStartDay() + 7) % 7;   // offset to the configured first column
  for (let i = 0; i < lead; i++) html += '<div class="day pad"></div>';

  for (let i = 1; i <= last; i++) {
    const iso = month.slice(0, 8) + pad(i);
    const earned = dayTotal(iso);
    const lv = earned === 0 ? 0 : Math.min(4, Math.ceil((earned / peak) * 4));
    const future = iso > state.today;
    html +=
      '<button class="day lv' + lv + (earned ? " has" : "") +
        (iso === state.selectedDay ? " sel" : "") + '"' +
        ' data-action="day" data-date="' + iso + '"' + (future ? " disabled" : "") +
        ' title="' + iso + " — " + earned + ' XP">' +
        (lv ? '<span class="fill" style="opacity:' + (0.15 + lv * 0.18).toFixed(2) + '"></span>' : "") +
        '<span class="n">' + i + "</span>" +
      "</button>";
  }
  html += "</div>";

  html += renderDayDetail();
  return html;
}

function renderDayDetail() {
  if (!state.selectedDay) {
    return '<p class="muted" style="margin-top:16px">Tap a day to see what was cleared.</p>';
  }
  const idx = completionIndex();
  const pr = progression();
  const done = completionsOn(state.selectedDay);
  const missed = missedOn(state.selectedDay, idx);
  const perfect = pr.perfectDays.indexOf(state.selectedDay) !== -1;
  const total = done.reduce((s, r) => s + (r.xp || 0), 0) + (perfect ? pr.dayBonus : 0);

  let html = '<div class="sechead">' + prettyDate(state.selectedDay) + " — " + total + " XP</div>";
  if (perfect) html += '<div class="fullclear">FULL CLEAR · +' + pr.dayBonus + " XP</div>";

  if (!done.length && !missed.length) {
    html += '<p class="empty">Nothing scheduled, nothing logged.</p>';
    return html;
  }

  if (done.length) {
    html += done.map(r => {
      const h = getHabit(r.habitId);
      return '<div class="panel"><div class="row">' +
        '<div class="grow"><div>' + esc(h ? h.name : r.habitId) + "</div>" +
        '<div class="muted">' + esc(attrName(r.attrId)) +
          (r.source !== "manual" ? " · " + esc(String(r.source).toUpperCase()) : "") + "</div></div>" +
        '<span class="xp">' + (r.xp || 0) + " XP</span>" +
        "</div></div>";
    }).join("");
  }

  if (missed.length) {
    html += '<div class="retrodate">MISSED</div>';
    html += missed.map(h =>
      '<div class="panel"><div class="risk">' + esc(h.name) + "</div></div>"
    ).join("");
  }
  return html;
}

function renderPerContract() {
  const idx = completionIndex();
  const ordered = state.habits.filter(h => !h.archived).concat(state.habits.filter(h => h.archived));

  if (!ordered.length) return '<p class="empty">No contracts yet.</p>';

  return ordered.map(h => {
    const dates = datesFor(idx, h.id);
    const ev = evaluateHabit(h, dates, state.today);
    const c = h.cadence || { type: "daily" };
    const counted = c.type === "n_per_week" || c.type === "n_per_month";

    let html = '<div class="sechead">' + esc(h.name) +
      (h.archived ? " — ARCHIVED" : "") + "</div>";

    html += '<div class="muted">' + esc(cadenceLabel(h)) +
      " · CURRENT RUN " + ev.run + " · LONGEST " + ev.longest +
      (ev.state === "fractured" ? ' · <span class="risk">SIGNAL DEGRADED</span>' : "") + "</div>";

    if (counted) {
      const periods = recentPeriods(h, dates, state.today, 12);
      html += '<div class="chips">' + periods.map(p =>
        '<span class="chip' + (p.met ? " met" : "") + '">' +
          esc(p.start.slice(5)) + " · " + p.count + "/" + p.target + "</span>"
      ).join("") + "</div>";
      html += '<div class="muted">LAST ' + periods.length +
        (c.type === "n_per_week" ? " WEEKS" : " MONTHS") + "</div>";
    } else {
      html += '<div class="strip">' + stripCells(h, dates, state.today).map(cell =>
        '<i class="' + cell.cls + '" title="' + cell.date + '"></i>'
      ).join("") + "</div>";
      html += '<div class="muted">LAST 90 DAYS</div>';
    }

    if (ev.segments.length) {
      html += ev.segments.slice().reverse().slice(0, 6).map(s =>
        '<div class="seg">' + s.length + " × " +
        (s.ended === "current" ? "CURRENT" : '<span class="risk">FLATLINED</span>') +
        " · " + esc(s.start) + " → " + esc(s.end || s.start) +
        (s.fractures ? " · " + s.fractures + " FRACTURE" + (s.fractures > 1 ? "S" : "") : "") +
        "</div>"
      ).join("");
    } else {
      html += '<div class="seg muted">No runs recorded yet.</div>';
    }
    return html;
  }).join("");
}

/* --- Jobs Board --- */
async function renderBoard() {
  const today = state.today;
  const idx = completionIndex();
  const active = state.habits.filter(h => !h.archived);

  if (!active.length) {
    view.innerHTML =
      '<div class="sechead">TODAY</div>' +
      '<p class="empty">No contracts yet. Open CONFIG to create your first one.</p>';
    return;
  }

  const evals = new Map();
  active.forEach(h => evals.set(h.id, evaluateHabit(h, datesFor(idx, h.id), today)));

  const pending = [];
  const cleared = [];
  active.forEach(h => {
    const ev = evals.get(h.id);
    if (ev.doneToday) cleared.push(h);
    else if (ev.dueToday) pending.push(h);
  });

  const grid = boardView() === "grid";
  let html = statsBar();

  if (progression().todayPerfect) {
    html += '<div class="fullclear">FULL CLEAR</div>';
  }

  html += viewToggle();
  html += '<div class="sechead">TODAY — ' + pending.length + " OPEN</div>";

  if (!pending.length) {
    html += '<p class="empty">All contracts cleared.</p>';
  } else if (grid) {
    html += '<div class="nodegrid">' + pending.map(h => node(h, evals.get(h.id), false)).join("") + "</div>";
  } else {
    html += pending.map(h => card(h, evals.get(h.id), false)).join("");
  }

  html += renderRetro(idx, active);

  if (cleared.length) {
    html += '<div class="sechead">CLEARED — ' + cleared.length + "</div>";
    html += grid
      ? '<div class="nodegrid">' + cleared.map(h => node(h, evals.get(h.id), true)).join("") + "</div>"
      : cleared.map(h => card(h, evals.get(h.id), true)).join("");
  }

  view.innerHTML = html;
}

/* LOG RETRO — occurrences missed within the backfill window.
   Full XP, no fracture, recorded as source: "backfill". */
function renderRetro(idx, active) {
  const groups = [];
  backfillDates(new Date()).forEach(d => {
    const owed = active.filter(h => !h.external && wasDueOn(h, datesFor(idx, h.id), d));
    if (owed.length) groups.push({ date: d, habits: owed });
  });
  if (!groups.length) return "";

  let html = '<div class="sechead">LOG RETRO</div>';
  html += '<p class="muted">Done but not logged. Full XP, no penalty. Closes ' +
    backfillWindowHours() + "h after the occurrence.</p>";

  groups.forEach(g => {
    html += '<div class="retrodate">' + prettyDate(g.date) + "</div>";
    html += g.habits.map(h =>
      '<div class="card" style="--edge:' + attrColour(h.attrId) + '">' +
        '<div class="body glyphrow">' +
          '<span class="cardglyph">' + glyphSVG(h.icon) + '</span><span class="grow">' +
            '<div class="name">' + esc(h.name) + "</div>" +
            '<div class="meta">' + esc(attrName(h.attrId)) + " &nbsp; " +
              '<span class="xp">' + xpFor(h) + " XP</span></div>" +
          "</span>" +
        "</div>" +
        '<div class="side"><button class="btn small" data-action="retro" data-id="' +
          h.id + '" data-date="' + g.date + '">LOG</button></div>' +
      "</div>"
    ).join("");
  });
  return html;
}

function bar(into, span, cls, fill) {
  const pct = span > 0 ? Math.max(0, Math.min(100, (into / span) * 100)) : 100;
  return '<div class="bar' + (cls ? " " + cls : "") + '"><i style="width:' + pct.toFixed(1) + '%' +
    (fill ? ";background:" + fill : "") + '"></i></div>';
}

function statsBar() {
  const p = progression();
  const c = p.char;
  const pct = c.span > 0 ? Math.max(0, Math.min(100, (c.into / c.span) * 100)) : 100;
  return '<div class="hud"><span class="micro">' + microFor("hud") + "</span>" +
    '<div class="stats">' +
      '<div><div class="lv tnum">' + tnum(c.level) + "</div>" +
        '<div class="muted">LEVEL · <span id="xp-total" class="tnum">' + tnum(p.totalXP) + "</span> XP</div></div>" +
      '<div class="sc">STREET CRED ' + p.scBar.level + "<br>" + titleFor(p.scBar.level) +
        '<br><span class="tx tnum">' + tnum("+" + p.todayXP) + "</span> TODAY</div>" +
    "</div>" +
    '<div class="bar"><i id="xp-bar" style="width:' + pct.toFixed(1) + '%"></i></div>' +
    '<div class="muted">' +
      (c.atCap ? "MAX LEVEL" : Math.max(0, c.span - c.into) + " XP TO LEVEL " + (c.level + 1)) +
    "</div></div>";
}

/* Completion feedback, the moment the whole app exists for:
   haptic, edge flash, numeral counts up, bar advances behind a glow,
   card settles. Comfortably under 600ms end to end. */
let pendingAnim = null;

function runStatsAnimation() {
  if (!pendingAnim) return;
  const a = pendingAnim;
  pendingAnim = null;
  const barEl = document.getElementById("xp-bar");
  const numEl = document.getElementById("xp-total");
  if (barEl && !reducedMotion()) {
    barEl.style.transition = "none";
    barEl.style.width = a.fromPct.toFixed(1) + "%";
    void barEl.offsetWidth;                       // force the start position to stick
    barEl.style.transition = "";
    barEl.style.width = a.toPct.toFixed(1) + "%";
  }
  if (numEl) countUp(numEl, a.fromXP, a.toXP, 500);
}

function countUp(el, from, to, ms) {
  if (reducedMotion() || from === to) { el.innerHTML = tnum(to); return; }
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / ms);
    const eased = 1 - Math.pow(1 - k, 3);
    el.innerHTML = tnum(Math.round(from + (to - from) * eased));
    if (k < 1) requestAnimationFrame(step);
  })(performance.now());
}

function showOverlay(kicker, big, sub, perkNames) {
  document.getElementById("ov-kicker").textContent = kicker;
  document.getElementById("ov-big").innerHTML = big;
  document.getElementById("ov-sub").textContent = sub || "";
  document.getElementById("ov-perks").innerHTML =
    (perkNames || []).map(n => "<div>" + esc(n) + "</div>").join("");
  const ov = document.getElementById("overlay");
  ov.className = "on";
  fx(ov.querySelector(".inner"), "sweep", 700);
}

    "</div>";

function tierChip(h) {
  return h.tier.slice(0, 3).toUpperCase();

/* A dashboard node. Circular, compact enough to fit nine or ten in
   one screen, with the glyph carrying the identity and the run as a
   badge on the rim. The hold charge sweeps the ring itself, which is
   why a circle beats the old square: the dash animation is uniform
   the whole way round.

   Ring circumference at r=46 is 2*PI*46 = 289.03, which is where the
   dasharray below comes from. */
function node(h, ev, isDone) {
  const p = progression();
  const cls = "node" + (isDone ? " done" : "") + (h.external ? " ext" : "") +
    (ev.state === "fractured" ? " frac" : "");
  const edge = (!isDone && !h.external && ev.state !== "fractured")
    ? ' style="--edge:' + attrColour(h.attrId) + '"' : "";

  return '<button class="' + cls + '"' + edge +
      ' data-action="' + (isDone ? "undo" : "hold") + '" data-id="' + h.id + '"' +
      (h.external ? " disabled" : "") + ">" +
      '<span class="disc">' +
        '<svg class="ringsvg" viewBox="0 0 100 100" aria-hidden="true">' +
          '<circle class="rbase" cx="50" cy="50" r="46"/>' +
          '<circle class="rprog" cx="50" cy="50" r="46"/>' +
        "</svg>" +
        '<span class="nglyph">' + glyphSVG(h.icon, "big") + "</span>" +
        (isDone
          ? '<span class="nbadge done">&#10003;</span>'
          : '<span class="nbadge tnum' + (ev.run ? "" : " zero") + '">' + tnum(ev.run) + "</span>") +
      "</span>" +
      '<span class="nname">' + esc(h.name) + "</span>" +
      '<span class="nmeta">' +
        (ev.state === "fractured" ? '<span class="risk">DEGRADED</span>' : tierChip(h)) +
      "</span>" +
    "</button>";
}

/* --- hold to clear -------------------------------------------
   pointerdown starts the charge, and anything that interrupts it —
   lifting, dragging to scroll, the browser cancelling the gesture —
   aborts cleanly. The commit only fires if the hold survives. */
const HOLD_MS = 620;
let holdTimer = null, holdEl = null, holdStart = null;

function cancelHold() {
  clearTimeout(holdTimer);
  holdTimer = null;
  if (holdEl) holdEl.classList.remove("charging");
  holdEl = null;
  holdStart = null;
}

function beginHold(el, ev) {
  if (el.disabled) return;
  cancelHold();
  holdEl = el;
  holdStart = { x: ev.clientX, y: ev.clientY };
  el.classList.add("charging");
  haptic(8);
  holdTimer = setTimeout(() => {
    const target = holdEl;
    cancelHold();
    if (target) commitHold(target);
  }, reducedMotion() ? 200 : HOLD_MS);
}

async function commitHold(el) {
  haptic(28);
  fx(el, "jolt", 320);
  await completeHabit(el.dataset.id, state.today, "manual");
}

document.addEventListener("pointerdown", function (ev) {
  const el = ev.target.closest('[data-action="hold"]');
  if (el) beginHold(el, ev);
});
document.addEventListener("pointerup", cancelHold);
document.addEventListener("pointercancel", cancelHold);
document.addEventListener("pointermove", function (ev) {
  if (!holdStart) return;
  // A drag means they meant to scroll the board, not clear a contract.
  if (Math.abs(ev.clientX - holdStart.x) > 12 || Math.abs(ev.clientY - holdStart.y) > 12) cancelHold();
});

/* --- glyph picker --------------------------------------------- */
function glyphName(id) {
  const g = GLYPH_BY_ID[id];
  return g ? g.n : "No glyph";
}

function glyphPicker(selected) {
  const cat = state.glyphCat;
  const list = cat === "all" ? GLYPHS : GLYPHS.filter(g => g.c === cat);

  let html = '<div class="glyphcats">' +
    '<button data-action="gcat" data-c="all" class="' + (cat === "all" ? "on" : "") + '">ALL</button>' +
    GLYPH_CATS.map(c =>
      '<button data-action="gcat" data-c="' + c.id + '" class="' + (cat === c.id ? "on" : "") + '">' +
        c.name.toUpperCase() + "</button>"
    ).join("") + "</div>";

  html += '<div class="glyphgrid">' + list.map(g =>
    '<button data-action="gpick" data-g="' + g.i + '" class="' + (g.i === selected ? "on" : "") + '"' +
      ' title="' + esc(g.n) + '">' + glyphSVG(g.i) + "</button>"
  ).join("") + "</div>";

  html += '<div class="btnrow"><button class="btn" data-action="gclose">DONE</button></div>';
  return html;
}

function card(h, ev, isDone) {
  const p = progression();
  const cls = "card" + (isDone ? " done" : "") + (h.external ? " ext" : "") +
    (ev.state === "fractured" ? " frac" : "");

  /* Attribute colour only applies to the pending state. Complete,
     fractured and external each own the left edge in their own right. */
  const edge = (!isDone && !h.external && ev.state !== "fractured")
    ? ' style="--edge:' + attrColour(h.attrId) + '"' : "";

  const bits = [
    esc(attrName(h.attrId)),
    '<span class="xp">' + xpAward(h, ev.run, p.attrLevels.get(h.attrId) || 1) + " XP</span>",
    esc(cadenceLabel(h))
  ];
  const prog = progressLabel(h, ev);
  if (prog) bits.push(esc(prog));
  const run = runLabel(ev);
  if (run) bits.push(run);
  if (h.external) bits.push('<span class="flag">EXTERNAL</span>');

  const body =
    '<button class="body glyphrow" data-action="' + (isDone ? "noop" : "complete") + '"' +
    ' data-id="' + h.id + '"' + (h.external ? " disabled" : "") + ">" +
      '<span class="cardglyph">' + glyphSVG(h.icon) + "</span><span class=\"grow\">" +
      '<div class="name">' + (isDone ? '<span class="glyph">&#10003;</span> ' : "") +
        esc(h.name) + "</div>" +
      '<div class="meta">' + bits.join(" &nbsp; ") +
        ' &nbsp; <span class="micro">' + microFor(h.id) + "</span></div></span>" +
    "</button>";

  const side = isDone
    ? '<div class="side"><button class="btn small" data-action="undo" data-id="' + h.id + '">UNDO</button></div>'
    : "";

  return '<div class="' + cls + '"' + edge + ">" + body + side + "</div>";
}

/* Any name typed but not yet saved is pulled into state before a
   re-render, so tapping a swatch never discards it. */
function harvestAttrNames() {
  document.querySelectorAll("[data-attr]").forEach(inp => {
    const at = getAttr(inp.dataset.attr);
    if (at && inp.value.trim()) at.name = inp.value.trim();

function renderAttributes() {
  const p = progression();
  const active = state.attrs.filter(a => !a.archived);
  const archived = state.attrs.filter(a => a.archived);

  let html = '<p class="muted">Three to six active attributes. Below three the radar is meaningless, above six it stops being readable on a phone.</p>';

  html += active.map(a => {
    const xp = p.attrXP.get(a.id) || 0;
    const users = state.habits.filter(h => !h.archived && h.attrId === a.id).length;
    return '<div class="panel" style="border-left:2px solid ' + attrColour(a.id) + '">' +
      '<div class="row"><input type="text" class="grow" data-attr="' + a.id + '" value="' + esc(a.name) + '">' +
        '<button class="btn small danger" data-action="attr-archive" data-id="' + a.id + '"' +
        (active.length <= 3 ? " disabled" : "") + ">ARCHIVE</button></div>" +
      '<div class="swatches">' + ATTR_COLOURS.map(c =>
        '<button class="swatch' + (a.colour === c ? " on" : "") + '"' +
          ' style="background:var(--attr-' + c + ')"' +
          ' data-action="attr-colour" data-id="' + a.id + '" data-colour="' + c + '"' +
          ' title="' + c + '"></button>'
      ).join("") + "</div>" +
      '<div class="muted">LV ' + (p.attrLevels.get(a.id) || 1) + " · " + xp + " XP · " +
        users + " CONTRACT" + (users === 1 ? "" : "S") + "</div>" +
    "</div>";
  }).join("");

  html += '<div class="btnrow">' +
    '<button class="btn primary" data-action="attr-save">SAVE NAMES</button>' +
    '<button class="btn" data-action="attr-new"' + (active.length >= 6 ? " disabled" : "") + ">+ ADD</button>" +
    "</div>";

  if (archived.length) {
    html += '<div class="sechead">ARCHIVED</div>';
    html += archived.map(a =>
      '<div class="panel"><div class="row"><div class="grow">' + esc(a.name) + "</div>" +
        '<button class="btn small" data-action="attr-restore" data-id="' + a.id + '"' +
        (active.length >= 6 ? " disabled" : "") + ">RESTORE</button></div></div>"
    ).join("");
  }
  return html;
}

  let html = '<div class="sechead">DISPLAY</div>';

  html += '<div class="checkline"><input type="checkbox" id="f-ambient"' +

    [["nightcity", "Night City"], ["militech", "Militech"], ["netwatch", "NetWatch"],
     ["arasaka", "Arasaka"], ["kangtao", "Kang Tao"]].map(o =>
      '<option value="' + o[0] + '"' + (cfg.THEME === o[0] ? " selected" : "") + ">" + o[1] + "</option>"
    ).join("") + "</select>";

  html += '<div class="sechead">TUNING</div>';
  html += '<div class="panel"><div class="muted">' +
    "LEVEL CONSTANT: " + cfg.LEVEL_CONSTANT + "<br>" +

  html += '<p class="muted">Compare your daily average against 70 after about thirty days, then adjust the level constant once.</p>';
  html += '<p class="micro" style="margin-top:20px">' + microFor("cfg") + " · ONLY CC35 CERTIFIED COMPONENTS</p>";

function renderData() {
  let html = '<div class="sechead">DATA DUMP</div>';
  html += '<p class="muted">Export is the only real backup. Browser storage can be evicted. Do this monthly, and before any move between devices.</p>';
  html += '<div class="btnrow">' +
    '<button class="btn primary" data-action="export-file">DOWNLOAD JSON</button>' +

  html += "<label>OR PASTE JSON</label>";

    "STORAGE BACKEND: " + Store.mode().toUpperCase() + "<br>" +

    "SCHEMA VERSION: " + SCHEMA_VERSION + "<br>" +

      state.habits.filter(h => h.archived).length + " ARCHIVED<br>" +

/* --- effects ---------------------------------------------------
   One helper for every completion moment in the app. Each effect is
   a one-shot class that is stripped again when it finishes, so
   nothing is left animating and nothing loops. */
function fx(el, name, ms) {
  if (!el || reducedMotion()) return;
  const cls = "fx-" + name;
  el.classList.remove(cls);
  void el.offsetWidth;                       // restart even if already applied
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms || 600);
}

function haptic(ms) {
  if (navigator.vibrate && !reducedMotion()) navigator.vibrate(ms);
}

/* ============================================================
   7. EDITOR ACTIONS
   ============================================================ */
function blankHabit() {
  const firstAttr = state.attrs.filter(a => !a.archived)[0];
  return {
    _isNew: true,
    id: null,
    name: "",
    icon: "target",
    attrId: firstAttr ? firstAttr.id : null,
    cadence: { type: "daily" },
    tier: "standard",
    notes: "",
    external: false,
    archived: false,
    createdAt: todayISO()
  };
}

/* Pull whatever is currently typed into the draft, so a cadence
   change or day toggle does not lose the rest of the form. */
function harvestEditor() {
  const e = state.editing;
  if (!e) return;
  const g = id => document.getElementById(id);
  if (g("f-name"))     e.name = g("f-name").value;
  if (g("f-attr"))     e.attrId = g("f-attr").value;
  if (g("f-tier"))     e.tier = g("f-tier").value;
  if (g("f-notes"))    e.notes = g("f-notes").value;
  if (g("f-external")) e.external = g("f-external").checked;
  if (g("f-n"))        e.cadence.n = Math.max(1, Number(g("f-n").value) || 1);
}

async function saveHabit() {
  harvestEditor();
  const e = state.editing;

  if (!e.name.trim()) { toast("A contract needs a name.", true); return; }
  if (!e.attrId)      { toast("A contract needs an attribute.", true); return; }
  if (e.cadence.type === "weekdays" && !(e.cadence.days || []).length) {
    toast("Pick at least one day.", true); return;
  }

  const record = {
    id: e.id || makeId("h_"),
    name: e.name.trim(),
    icon: e.icon.trim(),
    attrId: e.attrId,
    cadence: e.cadence,
    tier: e.tier,
    notes: e.notes.trim(),
    external: !!e.external,
    archived: !!e.archived,
    createdAt: e.createdAt || todayISO()
  };

  if (e.id) {
    const i = state.habits.findIndex(h => h.id === e.id);
    state.habits[i] = record;
  } else {
    state.habits.push(record);
  }

  await Store.save("habits", state.habits);
  state.editing = null;
  toast(e.id ? "Contract updated." : "Contract created.");
  render();
}

async function setArchived(id, flag) {
  const h = getHabit(id);
  if (!h) return;
  h.archived = flag;
  await Store.save("habits", state.habits);
  toast(flag ? "Archived. History kept." : "Restored.");
  render();
}

async function moveHabit(id, dir) {
  const active = state.habits.filter(h => !h.archived);
  const pos = active.findIndex(h => h.id === id);
  const swapWith = active[pos + dir];
  if (!swapWith) return;
  const a = state.habits.indexOf(active[pos]);
  const b = state.habits.indexOf(swapWith);
  const tmp = state.habits[a];
  state.habits[a] = state.habits[b];
  state.habits[b] = tmp;
  await Store.save("habits", state.habits);
  render();
}

/* ============================================================
   8. EXPORT / IMPORT
   ============================================================ */
async function buildExport() {
  const data = {
    cfg: state.cfg,
    attrs: state.attrs,
    habits: state.habits,
    meta: state.meta,
    plan: state.plan,
    logs: {}
  };
  const keys = await Store.listKeys("log:");
  for (const k of keys) {
    const rows = await Store.load(k);
    if (rows && rows.length) data.logs[k.slice(4)] = rows;
  }
  return {
    app: "night-city-os",
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    data: data
  };
}

async function exportFile() {
  const json = JSON.stringify(await buildExport(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "night-city-os-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Export downloaded.");
}

async function exportClipboard() {
  const json = JSON.stringify(await buildExport());
  try {
    await navigator.clipboard.writeText(json);
    toast("Export copied to clipboard.");
  } catch (err) {
    const ta = document.getElementById("f-import");
    if (ta) { ta.value = json; ta.select(); }
    toast("Clipboard blocked. Export placed in the text box — copy it manually.", true);
  }
}

async function importJSON(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (err) { toast("That is not valid JSON.", true); return; }

  const d = parsed && parsed.data;
  if (!parsed || parsed.app !== "night-city-os" || !d || !Array.isArray(d.habits) || !Array.isArray(d.attrs)) {
    toast("Not a NIGHT CITY OS export.", true);
    return;
  }
  if (parsed.schemaVersion !== SCHEMA_VERSION) {
    toast("Export is schema v" + parsed.schemaVersion + ", app is v" + SCHEMA_VERSION + ". Import stopped.", true);
    return;
  }
  if (!confirm("Replace all current data with this export? This cannot be undone.")) return;

  const oldKeys = await Store.listKeys("log:");
  for (const k of oldKeys) await Store.drop(k);

  state.cfg   = Object.assign(clone(DEFAULT_CFG), d.cfg || {});
  state.attrs = d.attrs;
  state.habits = d.habits;
  state.meta  = Object.assign(clone(DEFAULT_META), d.meta || {});
  state.logs.clear();
  invalidateIndex();

  await Store.save("cfg", state.cfg);
  await Store.save("attrs", state.attrs);
  await Store.save("habits", state.habits);
  await Store.save("meta", state.meta);

  const logs = d.logs || {};
  for (const wk in logs) {
    if (Object.prototype.hasOwnProperty.call(logs, wk)) {
      state.logs.set(wk, logs[wk]);
      await Store.save("log:" + wk, logs[wk]);
    }
  }

  state.view = "board";
  toast("Import complete.");
  render();
}

/* ============================================================
   9. EVENTS
   ============================================================ */
document.addEventListener("click", async function (ev) {
  const ov = document.getElementById("overlay");
  if (ov.className === "on") { ov.className = ""; return; }

  const el = ev.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const a = el.dataset.action;

  if (a === "nav") {
    state.view = el.dataset.view;
    state.editing = null;
    render();
  } else if (a === "tab") {
    state.configTab = el.dataset.tab;
    state.editing = null;
    render();
  } else if (a === "rtab") {  } else if (a === "rtab") {
    state.recordsTab = el.dataset.tab;
    render();
  } else if (a === "month") {
    const d = fromISO(state.recordsMonth);
    state.recordsMonth = toISO(new Date(d.getFullYear(), d.getMonth() + Number(el.dataset.dir), 1));
    state.selectedDay = null;
    render();
  } else if (a === "day") {
    state.selectedDay = state.selectedDay === el.dataset.date ? null : el.dataset.date;
    render();
  } else if (a === "complete") {
    const cardEl = el.closest(".card");
    if (cardEl && !reducedMotion()) {
      cardEl.classList.add("flash");
      fx(cardEl, "sweep", 480);
      fx(cardEl.querySelector(".name"), "chroma", 340);
      fx(cardEl.querySelector(".xp"), "pop", 340);
      haptic(12);
      await new Promise(r => setTimeout(r, 260));
    }
    await completeHabit(el.dataset.id, state.today, "manual");
  } else if (a === "retro") {
    const cardEl = el.closest(".card");
    if (cardEl && !reducedMotion()) { fx(cardEl, "sweep", 480); haptic(10); await new Promise(r => setTimeout(r, 200)); }
    await completeHabit(el.dataset.id, el.dataset.date, "backfill");
  } else if (a === "undo") {
    await undoCompletion(el.dataset.id, state.today);
  } else if (a === "bview") {
    state.cfg.BOARD_VIEW = el.dataset.v;
    await Store.save("cfg", state.cfg);
    render();
  } else if (a === "gopen") {
    harvestEditor();
    state.glyphOpen = !state.glyphOpen;
    render();
  } else if (a === "gclose") {
    harvestEditor();
    state.glyphOpen = false;
    render();
  } else if (a === "gcat") {
    harvestEditor();
    state.glyphCat = el.dataset.c;
    render();
  } else if (a === "gpick") {
    harvestEditor();
    state.editing.icon = el.dataset.g;
    state.glyphOpen = false;
    haptic(8);
    render();
  } else if (a === "new") {
    state.editing = blankHabit();
    render();
  } else if (a === "edit") {
    const h = getHabit(el.dataset.id);
    state.editing = JSON.parse(JSON.stringify(h));
    state.glyphOpen = false;
    render();
  } else if (a === "archive") {
    await setArchived(el.dataset.id, true);
  } else if (a === "restore") {
    await setArchived(el.dataset.id, false);
  } else if (a === "move") {
    await moveHabit(el.dataset.id, Number(el.dataset.dir));
  } else if (a === "save-habit") {
    await saveHabit();
  } else if (a === "cancel-habit") {
    state.editing = null;
    render();
  } else if (a === "day") {
    harvestEditor();
    const d = Number(el.dataset.day);
    const days = state.editing.cadence.days || [];
    const i = days.indexOf(d);
    if (i === -1) days.push(d); else days.splice(i, 1);
    state.editing.cadence.days = days;
    render();
  } else if (a === "attr-save") {
    harvestAttrNames();
    await Store.save("attrs", state.attrs);
    toast("Attribute names saved.");
    render();
  } else if (a === "attr-colour") {
    harvestAttrNames();
    getAttr(el.dataset.id).colour = el.dataset.colour;
    await Store.save("attrs", state.attrs);
    render();
  } else if (a === "attr-new") {
    harvestAttrNames();
    const used = state.attrs.map(x => x.colour);
    const free = ATTR_COLOURS.filter(c => used.indexOf(c) === -1);
    const id = makeId("a_");
    state.attrs.push({
      id: id,
      name: "New attribute",
      colour: free.length ? free[0] : ATTR_COLOURS[state.attrs.length % ATTR_COLOURS.length],
      archived: false
    });
    await Store.save("attrs", state.attrs);
    render();
  } else if (a === "attr-archive") {
    const at = getAttr(el.dataset.id);
    const users = state.habits.filter(h => !h.archived && h.attrId === at.id);
    if (users.length) {
      toast(users.length + " active contract" + (users.length === 1 ? "" : "s") + " still feed this. Move them first.", true);
      return;
    }
    at.archived = true;
    await Store.save("attrs", state.attrs);
    toast("Archived. Past XP stays attributed to it.");
    render();
  } else if (a === "attr-restore") {
    getAttr(el.dataset.id).archived = false;
    await Store.save("attrs", state.attrs);
    render();
  } else if (a === "export-file") {
    await exportFile();
  } else if (a === "export-clip") {
    await exportClipboard();
  } else if (a === "import-text") {
    const ta = document.getElementById("f-import");
    if (ta && ta.value.trim()) await importJSON(ta.value);
    else toast("Paste an export first, or choose a file.", true);
  }
});

document.addEventListener("change", async function (ev) {
  const el = ev.target;

  if (el.dataset && el.dataset.action === "cadence-type") {
    harvestEditor();
    const type = el.value;
    const old = state.editing.cadence || {};
    if (type === "weekdays") state.editing.cadence = { type: type, days: old.days || [] };
    else if (type === "n_per_week")  state.editing.cadence = { type: type, n: old.n || 3 };
    else if (type === "n_per_month") state.editing.cadence = { type: type, n: old.n || 8 };
    else state.editing.cadence = { type: "daily" };
    render();
  }

  if (el.id === "f-theme") {
    state.cfg.THEME = el.value;
    await Store.save("cfg", state.cfg);
    applyAmbient();
    return;
  }

  if (el.id === "f-ambient") {
    state.cfg.AMBIENT = el.checked;
    await Store.save("cfg", state.cfg);
    applyAmbient();
    return;
  }

  if (el.id === "f-weekstart") {
    state.cfg.WEEK_START_DAY = Number(el.value);
    await Store.save("cfg", state.cfg);
    render();
    return;
  }

  if (el.id === "f-file" && el.files && el.files[0]) {
    const text = await el.files[0].text();
    await importJSON(text);
  }
});

/* ============================================================
   11. SERVICE WORKER
   The shell is served from cache so the app opens instantly and
   works with no network. A new deploy is picked up in the
   background and offered — never applied underneath the user
   mid-tap, and never silently withheld either.
   ============================================================ */
function registerWorker() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "http:" && location.protocol !== "https:") return;

  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const fresh = reg.installing;
      if (!fresh) return;
      fresh.addEventListener("statechange", () => {
        // A waiting worker with one already in control means an update.
        if (fresh.state === "installed" && navigator.serviceWorker.controller) {
          showUpdateBanner(reg);
        }
      });
    });
    // Catch a build that landed while the app was closed.
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});

  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

function showUpdateBanner(reg) {
  const el = document.getElementById("update");
  el.className = "on";
  document.getElementById("update-go").onclick = () => {
    if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
    el.className = "";
  };
}

/* ============================================================
   12. BOOT
   ============================================================ */
function clone(o) { return JSON.parse(JSON.stringify(o)); }

async function boot() {
  await Store.init();
  state.cfg = await Store.load("cfg");
  if (!state.cfg) { state.cfg = clone(DEFAULT_CFG); await Store.save("cfg", state.cfg); }
  else state.cfg = Object.assign(clone(DEFAULT_CFG), state.cfg);

  state.attrs = await Store.load("attrs");
  if (!state.attrs) { state.attrs = clone(DEFAULT_ATTRS); await Store.save("attrs", state.attrs); }
  else {
    /* Attributes created before the identity palette existed carry no
       colour. Assign one each, additively, once. */
    let patched = false;
    state.attrs.forEach((a, i) => {
      if (!a.colour || ATTR_COLOURS.indexOf(a.colour) === -1) {
        const used = state.attrs.map(x => x.colour);
        const free = ATTR_COLOURS.filter(c => used.indexOf(c) === -1);
        a.colour = free.length ? free[0] : ATTR_COLOURS[i % ATTR_COLOURS.length];
        patched = true;
      }
    });
    if (patched) await Store.save("attrs", state.attrs);
  }

  state.habits = await Store.load("habits");
  if (!state.habits) { state.habits = []; await Store.save("habits", state.habits); }
  else {
    /* The external flag existed only for the gym module. With TRAINING
       gone nothing can satisfy such a contract, so it would sit
       permanently unclearable. Clearing the flag can only make days
       more complete, never less, so no XP is lost. */
    let freed = false;
    state.habits.forEach(h => { if (h.external) { h.external = false; freed = true; } });
    if (freed) await Store.save("habits", state.habits);
  }

  state.meta = await Store.load("meta");
  if (!state.meta) { state.meta = clone(DEFAULT_META); await Store.save("meta", state.meta); }
  if (!state.meta.records) state.meta.records = {};


  await loadAllLogs();
  await syncPerks();
  await snapshotTotals();
  render();
  requestPersistence();
  registerWorker();
}

boot();
